name: Setup Saltbox uv
description: Install the uv release pinned by Saltbox

runs:
  using: composite
  steps:
    - name: Read pinned uv version
      id: version
      shell: bash
      run: |
        # The pin sits at the root of the Saltbox checkout that holds this
        # action, wherever a workflow checked Saltbox out.
        uv_version=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/../../../.uv-version")
        if [[ ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid uv version: $uv_version" >&2
          exit 1
        fi
        echo "version=$uv_version" >> "$GITHUB_OUTPUT"

    - name: Install pinned uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: ${{ steps.version.outputs.version }}
        enable-cache: true
