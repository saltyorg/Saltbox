name: Trigger Documentation Automation

on:
  push:
    branches:
      - master
    paths:
      - 'roles/**'
      - 'resources/tasks/docker/**'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    if: github.repository == 'saltyorg/Saltbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Create documentation dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          owner: saltyorg
          repositories: docs
          permission-actions: write

      - name: Trigger documentation automation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run automation.yml --repo saltyorg/docs
