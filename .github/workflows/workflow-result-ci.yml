name: CI - Workflow Result

on:
  pull_request:
    paths:
      - '.github/workflows/workflow-result.yml'
      - '.github/workflows/workflow-result-ci.yml'
      - '.github/renovate.json'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/workflow-result.yml'
      - '.github/workflows/workflow-result-ci.yml'
      - '.github/renovate.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow result integration
        uses: saltyorg/github-actions/jactionlint@v1.5.4
        with:
          files: |
            .github/workflows/workflow-result.yml
            .github/workflows/workflow-result-ci.yml
