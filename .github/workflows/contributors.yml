name: Add contributors
on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-contributors:
    if: github.repository == 'saltyorg/Saltbox'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create contributor update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write

      - uses: BobAnkh/add-contributors@8bd02ce413bee09225ff2f27791ecb78ea273743 # master
        with:
          REPO_NAME: ${{ github.repository }}
          CONTRIBUTOR: '### Contributors'
          COLUMN_PER_ROW: '6'
          ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
          IMG_WIDTH: '100'
          FONT_SIZE: '14'
          PATH: '/README.md'
          COMMIT_MESSAGE: 'docs(README): update contributors'
          AVATAR_SHAPE: 'square'
