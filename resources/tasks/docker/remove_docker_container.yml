---
- name: Resources | Tasks | Docker | Remove Docker Container | Set '_var_prefix' variable
  ansible.builtin.set_fact:
    _var_prefix: "{{ var_prefix
                  if (var_prefix is defined)
                  else role_name }}"

- name: Resources | Tasks | Docker | Remove Docker Container | Set instance name
  ansible.builtin.set_fact:
    _instance_name: "{{ lookup('vars', _var_prefix + '_name', default=_var_prefix) }}"

- name: Resources | Tasks | Docker | Remove Docker Container | Resolve container name
  ansible.builtin.set_fact:
    _docker_container: "{{ container_name
                        if (container_name is defined)
                        else (lookup('docker_vars', specs={'_docker_container': {'default': _var_prefix}}))._docker_container }}"

- name: Resources | Tasks | Docker | Remove Docker Container | Resolve Docker variables
  ansible.builtin.set_fact:
    _docker_vars: "{{ lookup('docker_vars', specs=_docker_var_specs) }}"
  vars:
    _docker_var_specs:
      _docker_force_kill:
        omit: true
      _docker_kill_signal:
        omit: true
      _docker_stop_signal:
        omit: true
      _docker_stop_timeout:
        default: "180"

- name: Resources | Tasks | Docker | Remove Docker Container | Remove Docker Container
  community.docker.docker_container:
    container_default_behavior: compatibility
    force_kill: "{{ _docker_vars._docker_force_kill | default(omit) }}"
    kill_signal: "{{ _docker_vars._docker_kill_signal | default(omit) }}"
    name: "{{ _docker_container }}"
    state: absent
    stop_signal: "{{ _docker_vars._docker_stop_signal | default(omit) }}"
    stop_timeout: "{{ _docker_vars._docker_stop_timeout }}"
    tls_hostname: localhost
  register: remove_docker_result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: (remove_docker_result is succeeded)
