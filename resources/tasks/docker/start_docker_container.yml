---
- name: Resources | Tasks | Docker | Start Docker Container | Set '_var_prefix' variable
  ansible.builtin.set_fact:
    _var_prefix: "{{ var_prefix
                  if (var_prefix is defined)
                  else role_name }}"

- name: Resources | Tasks | Docker | Start Docker Container | Set instance name
  ansible.builtin.set_fact:
    _instance_name: "{{ lookup('vars', _var_prefix + '_name', default=_var_prefix) }}"

- name: Resources | Tasks | Docker | Start Docker Container | Resolve container name
  ansible.builtin.set_fact:
    _docker_container: "{{ container_name
                        if (container_name is defined)
                        else (lookup('docker_vars', specs={'_docker_container': {'default': _var_prefix}}))._docker_container }}"

- name: Resources | Tasks | Docker | Start Docker Container | Start Docker Container
  community.docker.docker_container:
    container_default_behavior: compatibility
    name: "{{ _docker_container }}"
    state: started
    tls_hostname: localhost
    comparisons:
      '*': ignore
  register: start_docker_result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: (start_docker_result is succeeded)
