---
- name: Cloudflare | Add DNS Record | IPv4 | Add DNS Record
  community.general.cloudflare_dns:
    account_api_key: "{{ cloudflare_api_key | default(omit, true) }}"
    account_email: "{{ cloudflare_email | default(omit, true) }}"
    api_token: "{{ cloudflare_scoped_token | default(omit, true) }}"
    zone: "{{ dns_zone }}"
    state: present
    solo: true
    proxied: "{{ _dns_proxy }}"
    type: A
    value: "{{ _dns_ipv4 }}"
    record: "{{ dns_record }}"
  register: cloudflare_dns_record_creation_status

- name: Cloudflare | Add DNS Record | IPv4 | Tasks on success
  when: (cloudflare_dns_record_creation_status is succeeded)
  block:
    - name: Cloudflare | Add DNS Record | IPv4 | Set 'dns_record_print' variable
      ansible.builtin.set_fact:
        dns_record_print: "{{ dns_zone
                           if (dns_record == dns_zone)
                           else dns_record + '.' + dns_zone }}"

    - name: Cloudflare | Add DNS Record | IPv4 | Display DNS Record creation status
      ansible.builtin.debug:
        msg: "DNS A Record for '{{ dns_record_print }}' set to '{{ _dns_ipv4 }}' was added. Proxy: {{ _dns_proxy }}"
