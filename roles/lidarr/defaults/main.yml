---
################################
# Basics
################################

lidarr_instances: ["lidarr"]

################################
# Settings
################################

lidarr_role_external_auth: true

# Do not edit or override using the inventory
lidarr_role_allowed_hosts_public_fqdn_default: "{{ lookup('role_var',
                                                          '_web_fqdn_override',
                                                          role='lidarr',
                                                          default=[lookup('role_web', role='lidarr')],
                                                          default_if_empty=true) }}"
# Do not edit or override using the inventory
lidarr_role_allowed_hosts_public_default: "{{ lidarr_role_allowed_hosts_public_fqdn_default
                                           if lookup('role_var', '_web_host_override', role='lidarr', default='') | length == 0
                                           else [] }}"
# Adds public hosts accepted by Lidarr. This is required when using a raw
# Traefik host override.
# Valid values are hostnames, IP addresses, or wildcard DNS names beginning
# with "*.". Do not include schemes, paths, or ports.
lidarr_role_allowed_hosts_public_custom: []
# Skip docs
lidarr_role_allowed_hosts_public: "{{ (lookup('role_var', '_allowed_hosts_public_default', role='lidarr')
                                       + lookup('role_var', '_allowed_hosts_public_custom', role='lidarr'))
                                      | reject('none')
                                      | map('string')
                                      | map('trim')
                                      | reject('equalto', '')
                                      | unique
                                      | list }}"
# Do not edit or override using the inventory
lidarr_role_allowed_hosts_aliases: "{{ ([lookup('role_var', '_docker_networks_alias', role='lidarr')]
                                        + lookup('role_var', '_docker_networks_alias_custom', role='lidarr', default=[]))
                                       | reject('none')
                                       | map('string')
                                       | map('trim')
                                       | reject('equalto', '')
                                       | unique
                                       | list }}"
# Do not edit or override using the inventory
lidarr_role_allowed_hosts_default: "{{ lookup('role_var', '_allowed_hosts_public', role='lidarr')
                                       + lookup('role_var', '_allowed_hosts_aliases', role='lidarr')
                                       + (lookup('role_var', '_allowed_hosts_aliases', role='lidarr')
                                          | map('regex_replace', '$', '.' + docker_networks_name_common)
                                          | list) }}"
# Adds extra hosts accepted by Lidarr, such as additional Docker or host-DNS
# aliases. This does not satisfy the public-host requirement for a raw Traefik
# host override. Valid values are hostnames, IP addresses, or wildcard DNS names
# beginning with "*.". Do not include schemes, paths, or ports.
lidarr_role_allowed_hosts_custom: []
# Skip docs
lidarr_role_allowed_hosts: "{{ (lookup('role_var', '_allowed_hosts_default', role='lidarr')
                                + lookup('role_var', '_allowed_hosts_custom', role='lidarr'))
                               | reject('none')
                               | map('string')
                               | map('trim')
                               | reject('equalto', '')
                               | unique
                               | list }}"

# Do not edit or override using the inventory
lidarr_role_trusted_networks_default: "{{ ['172.19.0.0/16']
                                          + (['fd00:dead:beef::/48'] if docker_ipv6 else []) }}"
# Adds reverse-proxy peers that Lidarr trusts to supply forwarded headers.
# Valid values are IPv4 or IPv6 addresses and CIDRs. Do not use hostnames or
# client networks.
lidarr_role_trusted_networks_custom: []
# Skip docs
lidarr_role_trusted_networks: "{{ (lookup('role_var', '_trusted_networks_default', role='lidarr')
                                   + lookup('role_var', '_trusted_networks_custom', role='lidarr'))
                                  | reject('none')
                                  | map('string')
                                  | map('trim')
                                  | reject('equalto', '')
                                  | unique
                                  | list }}"

################################
# Paths
################################

lidarr_role_paths_folder: "{{ lidarr_name }}"
lidarr_role_paths_location: "{{ server_appdata_path }}/{{ lidarr_role_paths_folder }}"
lidarr_role_paths_folders_list:
  - "{{ lidarr_role_paths_location }}"
lidarr_role_paths_config_location: "{{ lidarr_role_paths_location }}/config.xml"

################################
# Web
################################

lidarr_role_web_subdomain: "{{ lidarr_name }}"
lidarr_role_web_domain: "{{ user.domain }}"
lidarr_role_web_port: "8686"
lidarr_role_web_url: "{{ lookup('role_web', role='lidarr', scheme='https') }}"

################################
# DNS
################################

lidarr_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='lidarr') }}"
lidarr_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='lidarr') }}"
lidarr_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

lidarr_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
lidarr_role_traefik_middleware_default: "{{ traefik_default_middleware
                                            + (',themepark-' + lidarr_name
                                               if (lookup('role_var', '_themepark_enabled', role='lidarr') and global_themepark_plugin_enabled)
                                               else '') }}"
lidarr_role_traefik_middleware_custom: ""
lidarr_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
lidarr_role_traefik_middleware_custom_api: ""
lidarr_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
lidarr_role_traefik_enabled: true
lidarr_role_traefik_api_enabled: true
lidarr_role_traefik_api_endpoint: "PathPrefix(`/api`) || PathPrefix(`/feed`) || PathPrefix(`/ping`)"

################################
# Theme
################################

# Options can be found at https://github.com/themepark-dev/theme.park
lidarr_role_themepark_enabled: false
lidarr_role_themepark_app: "lidarr"
lidarr_role_themepark_theme: "{{ global_themepark_theme }}"
lidarr_role_themepark_domain: "{{ global_themepark_domain }}"
lidarr_role_themepark_addons: []

################################
# Docker
################################

# Container
lidarr_role_docker_container: "{{ lidarr_name }}"

# Image
lidarr_role_docker_image_pull: true
lidarr_role_docker_image_repo: "ghcr.io/hotio/lidarr"
lidarr_role_docker_image_tag: "release"
lidarr_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='lidarr') }}:{{ lookup('role_var', '_docker_image_tag', role='lidarr') }}"

# Envs
lidarr_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  UMASK: "002"
  TZ: "{{ tz }}"
lidarr_role_docker_envs_custom: {}
lidarr_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='lidarr')
                             | combine(lookup('role_var', '_docker_envs_custom', role='lidarr')) }}"

# Volumes
lidarr_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='lidarr') }}:/config"
  - "{{ server_appdata_path }}/scripts:/scripts"
lidarr_role_docker_volumes_legacy:
  - "/mnt/unionfs/Media/Music:/music"
lidarr_role_docker_volumes_custom: []
lidarr_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='lidarr')
                                + lookup('role_var', '_docker_volumes_custom', role='lidarr')
                                + (lookup('role_var', '_docker_volumes_legacy', role='lidarr')
                                   if docker_legacy_volume
                                   else []) }}"

# Labels
lidarr_role_docker_labels_default: {}
lidarr_role_docker_labels_custom: {}
lidarr_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='lidarr')
                               | combine((traefik_themepark_labels
                                          if (lookup('role_var', '_themepark_enabled', role='lidarr') and global_themepark_plugin_enabled)
                                          else {}),
                                         lookup('role_var', '_docker_labels_custom', role='lidarr')) }}"

# Hostname
lidarr_role_docker_hostname: "{{ lidarr_name }}"

# Networks
lidarr_role_docker_networks_alias: "{{ lidarr_name }}"
lidarr_role_docker_networks_default: []
lidarr_role_docker_networks_custom: []
lidarr_role_docker_networks: "{{ docker_networks_common
                                 + lookup('role_var', '_docker_networks_default', role='lidarr')
                                 + lookup('role_var', '_docker_networks_custom', role='lidarr') }}"

# Restart Policy
lidarr_role_docker_restart_policy: unless-stopped
