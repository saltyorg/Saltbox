---
# Restart only after changes

- name: "Restart | Set preinstall variables"
  ansible.builtin.set_fact:
    preinstall_kernel_restart: true
  when: ('preinstall' in ansible_run_tags)

- name: Restart | Report deferred manual reboot
  ansible.builtin.debug:
    msg: "A reboot is required to finish enabling the Intel iGPU."
  when:
    - ('preinstall' not in ansible_run_tags)
    - ('hetzner' not in ansible_run_tags)
    - not saltbox_auto_reboot

- name: Restart | Tasks for immediate reboot
  when:
    - ('preinstall' not in ansible_run_tags)
    - ('hetzner' in ansible_run_tags) or saltbox_auto_reboot
  block:
    - name: Restart | Success message
      ansible.builtin.debug:
        msg:
          - "GRUB was updated."
          - "Restarting the server to apply changes..."

    - name: Restart | Reboot
      ansible.builtin.command:
        argv:
          - "reboot"
