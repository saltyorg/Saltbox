---
- name: Update | Update linux kernel
  ansible.builtin.apt:
    name: "{{ kernel_update_apt_package_26 }}"
    install_recommends: true
    update_cache: true
    state: latest
  register: kernel_hwe_install_result

- name: Update | Fix broken APT install
  ansible.builtin.apt:
    state: fixed
  when: kernel_hwe_install_result.changed

- name: Update | Check if system needs to reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: kernel_hwe_reboot_required

- name: Update | Set 'reboot_is_necessary' variable
  ansible.builtin.set_fact:
    reboot_is_necessary: true
  when: kernel_hwe_reboot_required.stat.exists

- name: Update | Kernel was updated
  ansible.builtin.debug:
    msg: "Kernel was updated."
  when: kernel_hwe_install_result.changed

- name: Update | Kernel was not updated
  ansible.builtin.debug:
    msg: "Kernel was not updated."
  when: (not kernel_hwe_install_result.changed)
