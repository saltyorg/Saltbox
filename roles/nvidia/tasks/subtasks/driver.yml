---
- name: Driver | Read running kernel GCC version
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - -F=
      - '/^CONFIG_GCC_VERSION=/{ print int($2 / 10000); found=1 } END { if (!found) exit 1 }'
      - "/boot/config-{{ ansible_facts['kernel'] }}"
  register: nvidia_kernel_gcc_query
  changed_when: false
  failed_when: false

- name: Driver | Read running kernel build string
  ansible.builtin.command: "cat /proc/version"
  register: nvidia_kernel_build_string
  changed_when: false
  when: nvidia_kernel_gcc_query.rc != 0

- name: Driver | Resolve running kernel GCC major
  ansible.builtin.set_fact:
    nvidia_kernel_gcc_major: "{{ nvidia_kernel_gcc_query.stdout | int
                              if nvidia_kernel_gcc_query.rc == 0
                              else (nvidia_kernel_build_string.stdout
                                    | regex_findall('gcc[^,]*?([0-9]+)\\.[0-9]+\\.[0-9]+')
                                    | first | default('0') | int) }}"

- name: Driver | Validate running kernel GCC major
  ansible.builtin.assert:
    that:
      - nvidia_kernel_gcc_major | int > 0
    fail_msg: "Unable to determine the GCC major used to build kernel {{ ansible_facts['kernel'] }}."

- name: Driver | Check for running kernel compiler
  ansible.builtin.stat:
    path: "/usr/bin/gcc-{{ nvidia_kernel_gcc_major }}"
  register: nvidia_kernel_gcc

- name: Driver | Install running kernel compiler
  ansible.builtin.apt:
    name: "gcc-{{ nvidia_kernel_gcc_major }}"
    state: present
  when: not nvidia_kernel_gcc.stat.exists

- name: Driver | Install Nvidia driver
  ansible.builtin.command: "{{ nvidia_driver_install_command }}"
  environment:
    CC: "/usr/bin/gcc-{{ nvidia_kernel_gcc_major }}"
  register: nvidia_driver_install
  changed_when: true

- name: Driver | Display Nvidia installer output
  ansible.builtin.debug:
    var: nvidia_driver_install.stdout_lines
