---
- name: nvtop | Install gnupg Dependencies
  ansible.builtin.apt:
    name: dirmngr
    state: latest

- name: nvtop | Add signing key to /etc/apt/keyrings
  ansible.builtin.get_url:
    url: "{{ nvidia_nvtop_apt_key_url }}"
    dest: "{{ nvidia_nvtop_apt_repo_signed_by }}"
    mode: "0644"
  register: result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: result is succeeded
  when: ansible_facts['distribution_release'] in ['jammy', 'noble']

- name: nvtop | Remove legacy flexiondotorg repository and signing key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ nvidia_nvtop_apt_legacy_paths }}"
  register: nvidia_nvtop_legacy_repository_files

- name: nvtop | Add quentiumyt/nvtop repository
  ansible.builtin.deb822_repository:
    name: "{{ nvidia_nvtop_apt_repo_name }}"
    types:
      - deb
    uris: "{{ nvidia_nvtop_apt_repo_uris }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    architectures:
      - amd64
    signed_by: "{{ nvidia_nvtop_apt_repo_signed_by }}"
    state: present
  register: nvidia_nvtop_apt_repository_result
  when: ansible_facts['distribution_release'] in ['jammy', 'noble']

- name: nvtop | Update APT package index after repository change
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution_release'] in ['jammy', 'noble']
    - (nvidia_nvtop_legacy_repository_files is changed) or (nvidia_nvtop_apt_repository_result is changed)

- name: nvtop | Install nvtop
  ansible.builtin.apt:
    name: nvtop
    state: latest

- name: nvtop | Get nvtop binary version
  ansible.builtin.shell: "{{ nvidia_nvtop_binary_version_lookup_command }}"
  register: nvtop_binary_version
  ignore_errors: true

- name: nvtop | Display nvtop binary version
  ansible.builtin.debug:
    msg: "nvtop {{ nvtop_binary_version.stdout }} installed."
