---
- name: Restore legacy Jammy compiler default
  ansible.builtin.include_role:
    name: "kernel"
    tasks_from: "subtasks/restore_jammy_compiler.yml"
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_version'] == '22.04'

- name: Nvidia Purge Tasks
  ansible.builtin.include_tasks: "subtasks/purge.yml"
  when: ('nvidia-purge' in ansible_run_tags)

- name: Nvidia Setup Tasks
  when: not ('nvidia-purge' in ansible_run_tags)
  block:
    - name: Validate Nvidia configuration
      ansible.builtin.assert:
        that:
          - (nvidia_driver_version | string | length) > 0
          - (nvidia_driver_branch | string | lower == 'auto') or (nvidia_driver_branch | string is match('^[0-9]+$'))
          - nvidia_driver_module_flavor | lower in ['auto', 'open', 'proprietary']
          - ansible_facts['distribution_version'] in nvidia_driver_assistant_cuda_keyring_checksums
        fail_msg: "Invalid Nvidia driver selection configuration."

    - name: Create Nvidia cache directory
      ansible.builtin.file:
        path: "{{ nvidia_driver_cache_path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: "/etc/apt/keyrings"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Nvidia CUDA repository keyring package
      ansible.builtin.get_url:
        url: "{{ nvidia_driver_assistant_cuda_keyring_url }}"
        dest: "{{ nvidia_driver_assistant_cuda_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
        checksum: "{{ nvidia_driver_assistant_cuda_keyring_checksums[ansible_facts['distribution_version']] }}"
      register: nvidia_driver_assistant_cuda_keyring_download
      retries: 5
      delay: 10
      until: nvidia_driver_assistant_cuda_keyring_download is succeeded

    - name: Install Nvidia CUDA repository keyring package
      ansible.builtin.apt:
        deb: "{{ nvidia_driver_assistant_cuda_keyring_path }}"
        state: present
      register: nvidia_driver_assistant_cuda_keyring

    - name: Install Nvidia Driver Assistant
      ansible.builtin.apt:
        name: "{{ nvidia_driver_assistant_package }}"
        state: latest
        update_cache: true

    - name: Download Nvidia release metadata
      ansible.builtin.get_url:
        url: "{{ nvidia_driver_releases_url }}"
        dest: "{{ nvidia_driver_releases_path }}"
        owner: root
        group: root
        mode: "0600"
        force: true
      register: nvidia_driver_releases_download
      retries: 5
      delay: 10
      until: nvidia_driver_releases_download is succeeded

    - name: Download pinned Keylase patch
      ansible.builtin.get_url:
        url: "{{ nvidia_patch_download_url }}"
        dest: "{{ nvidia_patch_download_dest }}"
        owner: root
        group: root
        mode: "0700"
        checksum: "{{ nvidia_patch_checksum }}"
        force: true
      register: nvidia_patch_download
      retries: 5
      delay: 10
      until: nvidia_patch_download is succeeded
      when: nvidia_driver_version | lower != 'ignore'

    - name: Resolve hardware-compatible Nvidia driver
      nvidia_driver_resolver:
        catalog_path: "{{ nvidia_driver_assistant_catalog_path }}"
        releases_path: "{{ nvidia_driver_releases_path }}"
        patch_path: "{{ nvidia_patch_download_dest if (nvidia_driver_version | lower != 'ignore') else omit }}"
        driver_version: "{{ nvidia_driver_version }}"
        driver_branch: "{{ nvidia_driver_branch }}"
        module_flavor: "{{ nvidia_driver_module_flavor }}"
        patch_enabled: "{{ nvidia_patch_enabled }}"
        minimum_legacy_branch: "{{ nvidia_driver_minimum_legacy_branch }}"
      register: nvidia_driver_resolution

    - name: Display Nvidia hardware and driver resolution
      ansible.builtin.debug:
        msg:
          - "Detected Nvidia GPUs: {{ nvidia_driver_resolution.devices | map(attribute='name') | list }}"
          - "Driver mode: {{ nvidia_driver_resolution.mode }}"
          - "Resolved driver: {{ nvidia_driver_resolution.resolved_version }}"
          - "Resolved branch: {{ nvidia_driver_resolution.resolved_branch }}"
          - "Kernel module flavor: {{ nvidia_driver_resolution.module_flavor }}"
          - "Keylase patch required: {{ nvidia_driver_resolution.patch_required }}"

    - name: Install managed Nvidia driver build prerequisites
      ansible.builtin.apt:
        name:
          - "linux-headers-{{ ansible_facts['kernel'] }}"
          - build-essential
          - dkms
          - mokutil
          - pkg-config
        state: latest
      when: nvidia_driver_resolution.mode == 'managed'

    - name: Check Secure Boot state
      ansible.builtin.command: "mokutil --sb-state"
      register: nvidia_secure_boot_state
      changed_when: false
      failed_when: false
      when: nvidia_driver_resolution.mode == 'managed'

    - name: Reject managed driver installation with Secure Boot enabled
      ansible.builtin.fail:
        msg: "The Saltbox Nvidia runfile installation does not support Secure Boot. Disable Secure Boot or use nvidia_driver_version: 'ignore' with a trusted external driver."
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_secure_boot_state.rc == 0
        - "'SecureBoot enabled' in nvidia_secure_boot_state.stdout"

    - name: Download selected driver supported-products metadata
      ansible.builtin.get_url:
        url: "{{ nvidia_driver_supported_products_url }}"
        dest: "{{ nvidia_driver_supported_products_path }}"
        owner: root
        group: root
        mode: "0600"
        force: true
      register: nvidia_supported_products_download
      retries: 5
      delay: 10
      until: nvidia_supported_products_download is succeeded
      when: nvidia_driver_resolution.mode == 'managed'

    - name: Validate selected driver against its current supported-products list
      nvidia_driver_resolver:
        catalog_path: "{{ nvidia_driver_assistant_catalog_path }}"
        releases_path: "{{ nvidia_driver_releases_path }}"
        patch_path: "{{ nvidia_patch_download_dest }}"
        supported_products_path: "{{ nvidia_driver_supported_products_path }}"
        driver_version: "{{ nvidia_driver_version }}"
        driver_branch: "{{ nvidia_driver_branch }}"
        module_flavor: "{{ nvidia_driver_module_flavor }}"
        patch_enabled: "{{ nvidia_patch_enabled }}"
        minimum_legacy_branch: "{{ nvidia_driver_minimum_legacy_branch }}"
      register: nvidia_driver_supported_resolution
      failed_when: false
      when: nvidia_driver_resolution.mode == 'managed'

    - name: Reject unsupported exact or branch-pinned driver
      ansible.builtin.fail:
        msg: "{{ nvidia_driver_supported_resolution.msg }}"
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is defined
        - (nvidia_driver_version | lower != 'latest') or (nvidia_driver_branch | lower != 'auto')

    - name: Resolve production fallback for unsupported automatic LTS driver
      nvidia_driver_resolver:
        catalog_path: "{{ nvidia_driver_assistant_catalog_path }}"
        releases_path: "{{ nvidia_driver_releases_path }}"
        patch_path: "{{ nvidia_patch_download_dest }}"
        driver_version: "{{ nvidia_driver_version }}"
        driver_branch: "{{ nvidia_driver_branch }}"
        module_flavor: "{{ nvidia_driver_module_flavor }}"
        branch_preference: "production"
        patch_enabled: "{{ nvidia_patch_enabled }}"
        minimum_legacy_branch: "{{ nvidia_driver_minimum_legacy_branch }}"
      register: nvidia_driver_production_resolution
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is defined
        - nvidia_driver_version | lower == 'latest'
        - nvidia_driver_branch | lower == 'auto'

    - name: Use production fallback resolution
      ansible.builtin.set_fact:
        nvidia_driver_resolution: "{{ nvidia_driver_production_resolution }}"
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is defined
        - nvidia_driver_version | lower == 'latest'
        - nvidia_driver_branch | lower == 'auto'

    - name: Download production fallback supported-products metadata
      ansible.builtin.get_url:
        url: "{{ nvidia_driver_supported_products_url }}"
        dest: "{{ nvidia_driver_supported_products_path }}"
        owner: root
        group: root
        mode: "0600"
        force: true
      register: nvidia_production_supported_products_download
      retries: 5
      delay: 10
      until: nvidia_production_supported_products_download is succeeded
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is defined
        - nvidia_driver_version | lower == 'latest'
        - nvidia_driver_branch | lower == 'auto'

    - name: Validate production fallback supported-products list
      nvidia_driver_resolver:
        catalog_path: "{{ nvidia_driver_assistant_catalog_path }}"
        releases_path: "{{ nvidia_driver_releases_path }}"
        patch_path: "{{ nvidia_patch_download_dest }}"
        supported_products_path: "{{ nvidia_driver_supported_products_path }}"
        driver_version: "{{ nvidia_driver_version }}"
        driver_branch: "{{ nvidia_driver_branch }}"
        module_flavor: "{{ nvidia_driver_module_flavor }}"
        branch_preference: "production"
        patch_enabled: "{{ nvidia_patch_enabled }}"
        minimum_legacy_branch: "{{ nvidia_driver_minimum_legacy_branch }}"
      register: nvidia_driver_production_supported_resolution
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is defined
        - nvidia_driver_version | lower == 'latest'
        - nvidia_driver_branch | lower == 'auto'

    - name: Use validated automatic LTS Nvidia driver resolution
      ansible.builtin.set_fact:
        nvidia_driver_resolution: "{{ nvidia_driver_supported_resolution }}"
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_supported_resolution.msg is not defined

    - name: Inspect installed Nvidia driver
      ansible.builtin.command: "nvidia-smi --query-gpu=driver_version --format=csv,noheader,nounits"
      register: nvidia_installed_driver_query
      changed_when: false
      failed_when: false

    - name: Inspect installed Nvidia kernel module
      ansible.builtin.command: "modinfo -F version nvidia"
      register: nvidia_installed_module_query
      changed_when: false
      failed_when: false

    - name: Inspect installed Nvidia kernel module license
      ansible.builtin.command: "modinfo -F license nvidia"
      register: nvidia_installed_module_license_query
      changed_when: false
      failed_when: false

    - name: Define installed Nvidia driver state
      ansible.builtin.set_fact:
        nvidia_installed_driver_versions: "{{ nvidia_installed_driver_query.stdout_lines | map('trim') | reject('equalto', '') | unique | list }}"
        nvidia_installed_driver_healthy: "{{ nvidia_installed_driver_query.rc == 0
                                          and nvidia_installed_module_query.rc == 0
                                          and (nvidia_installed_driver_query.stdout_lines
                                               | map('trim') | reject('equalto', '') | list | length
                                               == nvidia_driver_resolution.devices | length)
                                          and (nvidia_installed_driver_query.stdout_lines
                                               | map('trim') | reject('equalto', '') | unique | list | length == 1)
                                          and (nvidia_installed_module_query.stdout | trim
                                               == nvidia_installed_driver_query.stdout_lines
                                               | first | default('') | trim) }}"
        nvidia_installed_module_flavor: "{{ 'open'
                                         if ('MIT' in nvidia_installed_module_license_query.stdout
                                             or 'GPL' in nvidia_installed_module_license_query.stdout)
                                         else 'proprietary' }}"

    - name: Check for Nvidia runfile uninstaller
      ansible.builtin.stat:
        path: "/usr/bin/nvidia-uninstall"
      register: nvidia_uninstaller

    - name: Check for Keylase patch backup
      ansible.builtin.stat:
        path: "{{ nvidia_patch_backup_file_location }}/libnvidia-encode.so.{{ nvidia_installed_driver_versions | first | default('unavailable') }}"
      register: nvidia_existing_patch_backup

    - name: Define whether managed Nvidia driver reconciliation is required
      ansible.builtin.set_fact:
        nvidia_driver_change_required: "{{ (not nvidia_installed_driver_healthy)
                                         or (nvidia_installed_driver_versions | first | default('')
                                             != nvidia_driver_resolution.resolved_version)
                                         or (nvidia_installed_module_flavor
                                             != nvidia_driver_resolution.module_flavor) }}"
      when: nvidia_driver_resolution.mode == 'managed'

    - name: Explain deferred Nvidia driver version change
      ansible.builtin.debug:
        msg:
          - "Installed driver: {{ nvidia_installed_driver_versions | first | default('unavailable') }}"
          - "Selected driver: {{ nvidia_driver_resolution.resolved_version }}"
          - "Run the nvidia tag to perform the driver replacement."
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_change_required
        - nvidia_installed_driver_healthy
        - not ('nvidia' in ansible_run_tags)

    - name: Reconcile managed Nvidia driver
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - nvidia_driver_change_required
        - (not nvidia_installed_driver_healthy) or ('nvidia' in ansible_run_tags)
      block:
        - name: Download selected Nvidia driver checksum and installer
          ansible.builtin.get_url:
            url: "{{ nvidia_driver_download_url }}"
            dest: "{{ nvidia_driver_download_dest }}"
            owner: root
            group: root
            mode: "0700"
            checksum: "sha256:{{ nvidia_driver_checksum_url }}"
            force: false
          register: nvidia_driver_download
          retries: 5
          delay: 10
          until: nvidia_driver_download is succeeded

        - name: Nvidia kernel tasks
          ansible.builtin.include_tasks: "subtasks/kernel.yml"

        - name: Replace Nvidia driver after kernel preflight
          block:
            - name: Gather services before Nvidia driver replacement
              ansible.builtin.service_facts:

            - name: Stop Docker socket before Nvidia driver replacement
              ansible.builtin.systemd_service:
                name: "docker.socket"
                state: stopped
              when: "'docker.socket' in ansible_facts['services']"

            - name: Stop Docker before Nvidia driver replacement
              ansible.builtin.systemd_service:
                name: "docker.service"
                state: stopped
              when: "'docker.service' in ansible_facts['services']"

            - name: Stop Nvidia persistence daemon before driver replacement
              ansible.builtin.systemd_service:
                name: "nvidia-persistenced.service"
                state: stopped
              when: "'nvidia-persistenced.service' in ansible_facts['services']"

            - name: Restore Keylase-patched library before driver replacement
              ansible.builtin.command:
                argv:
                  - /bin/bash
                  - "{{ nvidia_patch_download_dest }}"
                  - -r
              register: nvidia_patch_restore
              changed_when: "'Restore from backup' in nvidia_patch_restore.stdout"
              failed_when: false
              when:
                - nvidia_installed_driver_healthy
                - nvidia_existing_patch_backup.stat.exists

            - name: Remove Keylase backup before driver replacement
              ansible.builtin.file:
                path: "{{ nvidia_patch_backup_file_location }}"
                state: absent
              when: nvidia_existing_patch_backup.stat.exists

            - name: Uninstall existing runfile Nvidia driver
              ansible.builtin.command: "{{ nvidia_driver_uninstall_command }}"
              when: nvidia_uninstaller.stat.exists
              register: nvidia_driver_uninstall
              changed_when: true

            - name: Gather installed packages before driver replacement
              ansible.builtin.package_facts:
                manager: auto

            - name: Define installed Nvidia driver packages
              ansible.builtin.set_fact:
                nvidia_installed_driver_packages: "{{ ansible_facts['packages'].keys() | select('match', nvidia_driver_package_purge_regex) | list }}"

            - name: Remove packaged Nvidia drivers before runfile installation
              ansible.builtin.apt:
                name: "{{ nvidia_installed_driver_packages }}"
                state: absent
                purge: true
              when: nvidia_installed_driver_packages | length > 0

            - name: Nvidia driver installation tasks
              ansible.builtin.include_tasks: "subtasks/driver.yml"

    - name: Validate Nvidia driver
      ansible.builtin.include_tasks: "subtasks/validate.yml"
      when:
        - nvidia_driver_resolution.mode == 'external' or (not nvidia_driver_change_required) or ('nvidia' in ansible_run_tags) or (not nvidia_installed_driver_healthy)

    - name: Restore Keylase patch when disabled or unnecessary
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ nvidia_patch_download_dest }}"
          - -r
      register: nvidia_patch_opt_out_restore
      changed_when: "'Restore from backup' in nvidia_patch_opt_out_restore.stdout"
      when:
        - nvidia_driver_resolution.mode == 'managed'
        - not nvidia_driver_resolution.patch_required
        - nvidia_existing_patch_backup.stat.exists

    - name: Remove Keylase backup after patch restoration
      ansible.builtin.file:
        path: "{{ nvidia_patch_backup_file_location }}"
        state: absent
      when:
        - nvidia_patch_opt_out_restore is changed

    - name: Nvidia driver patch tasks
      ansible.builtin.include_tasks: "subtasks/patch.yml"
      when:
        - nvidia_driver_resolution.patch_required
        - nvidia_driver_resolution.mode == 'managed'
        - (not nvidia_driver_change_required) or ('nvidia' in ansible_run_tags) or (not nvidia_installed_driver_healthy)

    - name: Nvidia nvtop tasks
      ansible.builtin.include_tasks: "subtasks/nvtop.yml"

    - name: Configure Docker and Nvidia container toolkit
      ansible.builtin.include_role:
        name: "docker"
      when: ('nvidia' in ansible_run_tags)
