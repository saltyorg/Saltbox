---
################################
# Basics
################################

whisparr_instances: ["whisparr"]

################################
# Settings
################################

whisparr_role_external_auth: true

# Do not edit or override using the inventory
whisparr_role_allowed_hosts_public_fqdn_default: "{{ lookup('role_var',
                                                            '_web_fqdn_override',
                                                            role='whisparr',
                                                            default=[lookup('role_web', role='whisparr')],
                                                            default_if_empty=true) }}"
# Do not edit or override using the inventory
whisparr_role_allowed_hosts_public_default: "{{ whisparr_role_allowed_hosts_public_fqdn_default
                                             if lookup('role_var', '_web_host_override', role='whisparr', default='') | length == 0
                                             else [] }}"
# Adds public hosts accepted by Whisparr. This is required when using a raw
# Traefik host override.
# Valid values are hostnames, IP addresses, or wildcard DNS names beginning
# with "*.". Do not include schemes, paths, or ports.
whisparr_role_allowed_hosts_public_custom: []
# Skip docs
whisparr_role_allowed_hosts_public: "{{ (lookup('role_var', '_allowed_hosts_public_default', role='whisparr')
                                         + lookup('role_var', '_allowed_hosts_public_custom', role='whisparr'))
                                        | reject('none')
                                        | map('string')
                                        | map('trim')
                                        | reject('equalto', '')
                                        | unique
                                        | list }}"
# Do not edit or override using the inventory
whisparr_role_allowed_hosts_aliases: "{{ ([lookup('role_var', '_docker_networks_alias', role='whisparr')]
                                          + lookup('role_var', '_docker_networks_alias_custom', role='whisparr', default=[]))
                                         | reject('none')
                                         | map('string')
                                         | map('trim')
                                         | reject('equalto', '')
                                         | unique
                                         | list }}"
# Do not edit or override using the inventory
whisparr_role_allowed_hosts_default: "{{ lookup('role_var', '_allowed_hosts_public', role='whisparr')
                                         + lookup('role_var', '_allowed_hosts_aliases', role='whisparr')
                                         + (lookup('role_var', '_allowed_hosts_aliases', role='whisparr')
                                            | map('regex_replace', '$', '.' + docker_networks_name_common)
                                            | list) }}"
# Adds extra hosts accepted by Whisparr, such as additional Docker or host-DNS
# aliases. This does not satisfy the public-host requirement for a raw Traefik
# host override. Valid values are hostnames, IP addresses, or wildcard DNS names
# beginning with "*.". Do not include schemes, paths, or ports.
whisparr_role_allowed_hosts_custom: []
# Skip docs
whisparr_role_allowed_hosts: "{{ (lookup('role_var', '_allowed_hosts_default', role='whisparr')
                                  + lookup('role_var', '_allowed_hosts_custom', role='whisparr'))
                                 | reject('none')
                                 | map('string')
                                 | map('trim')
                                 | reject('equalto', '')
                                 | unique
                                 | list }}"

# Do not edit or override using the inventory
whisparr_role_trusted_networks_default: "{{ ['172.19.0.0/16']
                                            + (['fd00:dead:beef::/48'] if docker_ipv6 else []) }}"
# Adds reverse-proxy peers that Whisparr trusts to supply forwarded headers.
# Valid values are IPv4 or IPv6 addresses and CIDRs. Do not use hostnames or
# client networks.
whisparr_role_trusted_networks_custom: []
# Skip docs
whisparr_role_trusted_networks: "{{ (lookup('role_var', '_trusted_networks_default', role='whisparr')
                                     + lookup('role_var', '_trusted_networks_custom', role='whisparr'))
                                    | reject('none')
                                    | map('string')
                                    | map('trim')
                                    | reject('equalto', '')
                                    | unique
                                    | list }}"

################################
# Paths
################################

whisparr_role_paths_folder: "{{ whisparr_paths_folder | default(whisparr_name) }}"
whisparr_role_paths_location: "{{ whisparr_paths_location
                                  | default(server_appdata_path + '/' + whisparr_role_paths_folder) }}"
whisparr_role_paths_config_location: "{{ whisparr_paths_config_location
                                         | default(whisparr_role_paths_location + '/config.xml') }}"
whisparr_role_paths_folders_list: "{{ whisparr_paths_folders_list
                                      | default([whisparr_role_paths_location]) }}"

################################
# Web
################################

whisparr_role_web_subdomain: "{{ whisparr_name }}"
whisparr_role_web_domain: "{{ user.domain }}"
whisparr_role_web_port: "6969"
whisparr_role_web_url: "{{ lookup('role_web', role='whisparr', scheme='https') }}"

################################
# DNS
################################

whisparr_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='whisparr') }}"
whisparr_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='whisparr') }}"
whisparr_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

whisparr_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
whisparr_role_traefik_middleware_default: "{{ traefik_default_middleware
                                              + (',themepark-' + whisparr_name
                                                 if (lookup('role_var', '_themepark_enabled', role='whisparr') and global_themepark_plugin_enabled)
                                                 else '') }}"
whisparr_role_traefik_middleware_custom: ""
whisparr_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
whisparr_role_traefik_middleware_custom_api: ""
whisparr_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
whisparr_role_traefik_enabled: true
whisparr_role_traefik_api_enabled: true
whisparr_role_traefik_api_endpoint: "PathPrefix(`/api`)"

################################
# Theme
################################

# Options can be found at https://github.com/themepark-dev/theme.park
whisparr_role_themepark_enabled: false
whisparr_role_themepark_app: "whisparr"
whisparr_role_themepark_theme: "{{ global_themepark_theme }}"
whisparr_role_themepark_domain: "{{ global_themepark_domain }}"
whisparr_role_themepark_addons: []

################################
# Docker
################################

# Container
whisparr_role_docker_container: "{{ whisparr_name }}"

# Image
whisparr_role_docker_image_pull: true
whisparr_role_docker_image_repo: "ghcr.io/hotio/whisparr"
whisparr_role_docker_image_tag: "nightly"
whisparr_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='whisparr') }}:{{ lookup('role_var', '_docker_image_tag', role='whisparr') }}"

# Envs
whisparr_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  UMASK: "002"
  TZ: "{{ tz }}"
whisparr_role_docker_envs_custom: {}
whisparr_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='whisparr')
                               | combine(lookup('role_var', '_docker_envs_custom', role='whisparr')) }}"

# Volumes
whisparr_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='whisparr') }}:/config"
  - "{{ server_appdata_path }}/scripts:/scripts"
whisparr_role_docker_volumes_custom: []
whisparr_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='whisparr')
                                  + lookup('role_var', '_docker_volumes_custom', role='whisparr') }}"

# Labels
whisparr_role_docker_labels_default: {}
whisparr_role_docker_labels_custom: {}
whisparr_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='whisparr')
                                 | combine((traefik_themepark_labels
                                            if (lookup('role_var', '_themepark_enabled', role='whisparr') and global_themepark_plugin_enabled)
                                            else {}),
                                           lookup('role_var', '_docker_labels_custom', role='whisparr')) }}"

# Hostname
whisparr_role_docker_hostname: "{{ whisparr_name }}"

# Networks
whisparr_role_docker_networks_alias: "{{ whisparr_name }}"
whisparr_role_docker_networks_default: []
whisparr_role_docker_networks_custom: []
whisparr_role_docker_networks: "{{ docker_networks_common
                                   + lookup('role_var', '_docker_networks_default', role='whisparr')
                                   + lookup('role_var', '_docker_networks_custom', role='whisparr') }}"

# Restart Policy
whisparr_role_docker_restart_policy: unless-stopped
