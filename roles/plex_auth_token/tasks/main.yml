---
- name: "Auth Token | Check if Plex instance is defined"
  ansible.builtin.set_fact:
    plex_name: "{{ plex_name | default(plex_instances[0]) }}"

- name: "Auth Token | Validate Proxy and Network Mode when in use"
  ansible.builtin.assert:
    that:
      - "'container:' in lookup('role_var', '_docker_network_mode', role='plex', default=docker_networks_name_common)"
    fail_msg:
      - "Using {{ plex_name }}_auth_token_proxy assumes {{ plex_name }}_docker_network_mode is defined and it is not set correctly."
      - "Ensure that you have removed _default from {{ plex_name }}_docker_network_mode if you have previously used {{ plex_name }}_docker_network_mode_default in the inventory"
  when: (plex_role_proxy_lookup | length > 0)

- name: "Auth Token | Load facts and generate missing defaults"
  saltbox_facts:
    role: "plex"
    instance: "{{ plex_name }}"
    keys:
      client_identifier: "Saltbox{{ lookup('password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8) }}"
      token: ""
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: plex_auth_token_facts
  no_log: true

- name: "Auth Token | Replace empty client identifier"
  saltbox_facts:
    role: "plex"
    instance: "{{ plex_name }}"
    keys:
      client_identifier: "Saltbox{{ lookup('password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8) }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
    overwrite: true
  register: plex_auth_client_identifier_facts
  when: (plex_auth_token_facts.facts.client_identifier | length == 0)
  no_log: true

- name: "Auth Token | Set authentication variables from facts"
  ansible.builtin.set_fact:
    plex_auth_client_identifier: "{{ _plex_auth_facts.client_identifier }}"
    plex_auth_token: "{{ _plex_auth_facts.token | regex_replace('\n', '') }}"
  vars:
    _plex_auth_facts: "{{ plex_auth_client_identifier_facts.facts | default(plex_auth_token_facts.facts) }}"
  no_log: true

- name: "Auth Token | Set plex_no_token status"
  ansible.builtin.set_fact:
    plex_no_token: "{{ plex_auth_token | length == 0 }}"

- name: "Auth Token | Network Container Health Status"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/network_container_health_status.yml"
  vars:
    network_container_source: "{{ lookup('role_var', '_docker_container', role='plex', default=plex_name) }}"
    network_container_target: "{{ lookup('role_var', '_docker_network_mode', role='plex', default=docker_networks_name_common) | split(':') | last }}"
  when: (plex_role_proxy_lookup | length > 0)

- name: "Auth Token | Check if Token is valid"
  ansible.builtin.uri:
    url: "https://plex.tv/api/v2/user"
    method: GET
    return_content: true
    body:
      X-Plex-Token: "{{ plex_auth_token }}"
      X-Plex-Version: "{{ plex_auth_token_version }}"
      X-Plex-Product: "{{ plex_auth_token_product }}"
      X-Plex-Client-Identifier: "{{ plex_auth_client_identifier }}"
      X-Plex-Platform: "{{ plex_auth_token_platform }}"
      X-Plex-Platform-Version: "{{ plex_auth_token_platform_version }}"
      X-Plex-Device: "{{ plex_auth_token_device }}"
      X-Plex-Device-Name: "{{ plex_auth_token_device_name }}"
    body_format: form-urlencoded
    headers:
      Accept: "application/json"
    status_code: [200, 401]
  environment: "{{ plex_proxy_dict }}"
  register: plex_token
  when: (not plex_no_token)

- name: "Auth Token | Generate New Token"
  when: (plex_no_token or (plex_token.status == 401))
  block:
    - name: "Auth Token | Generate PIN"
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/pins"
        method: POST
        return_content: true
        body:
          strong: "true"
          X-Plex-Version: "{{ plex_auth_token_version }}"
          X-Plex-Product: "{{ plex_auth_token_product }}"
          X-Plex-Client-Identifier: "{{ plex_auth_client_identifier }}"
          X-Plex-Platform: "{{ plex_auth_token_platform }}"
          X-Plex-Platform-Version: "{{ plex_auth_token_platform_version }}"
          X-Plex-Device: "{{ plex_auth_token_device }}"
          X-Plex-Device-Name: "{{ plex_auth_token_device_name }}"
        body_format: form-urlencoded
        headers:
          Accept: "application/json"
        status_code: 201
      environment: "{{ plex_proxy_dict }}"
      register: plex_pin

    - name: "Auth Token | Prompt user to login"
      ansible.builtin.pause:
        prompt: "Please open https://app.plex.tv/auth#?clientID={{ plex_pin.json.clientIdentifier }}&code={{ plex_pin.json.code }}&context%5Bdevice%5D%5Bproduct%5D={{ plex_pin.json.product }} and login. Hit enter after having logged in"  # noqa 204 line-length

    - name: "Auth Token | Check PIN"
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/pins/{{ plex_pin.json.id }}"
        method: GET
        return_content: true
        body:
          X-Plex-Client-Identifier: "{{ plex_auth_client_identifier }}"
        body_format: form-urlencoded
        headers:
          Accept: "application/json"
        status_code: 200
      environment: "{{ plex_proxy_dict }}"
      register: plex_token_new

    - name: "Auth Token | Set plex_auth_token variable"
      ansible.builtin.set_fact:
        plex_auth_token: "{{ plex_token_new.json.authToken | regex_replace('\n', '') }}"

    - name: "Auth Token | Check if new Token is valid"
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/user"
        method: GET
        return_content: true
        body:
          X-Plex-Token: "{{ plex_auth_token }}"
          X-Plex-Version: "{{ plex_auth_token_version }}"
          X-Plex-Product: "{{ plex_auth_token_product }}"
          X-Plex-Client-Identifier: "{{ plex_auth_client_identifier }}"
          X-Plex-Platform: "{{ plex_auth_token_platform }}"
          X-Plex-Platform-Version: "{{ plex_auth_token_platform_version }}"
          X-Plex-Device: "{{ plex_auth_token_device }}"
          X-Plex-Device-Name: "{{ plex_auth_token_device_name }}"
        body_format: form-urlencoded
        headers:
          Accept: "application/json"
        status_code: [200, 401]
      environment: "{{ plex_proxy_dict }}"
      register: plex_new_token

    - name: "Auth Token | Fail if new token is invalid"
      ansible.builtin.fail:
        msg: "Something went wrong with the creation of the new token"
      when: (plex_new_token.status == 401)

    - name: "Auth Token | Save facts for a specific instance"
      saltbox_facts:
        role: "plex"
        instance: "{{ plex_name }}"
        keys:
          client_identifier: "{{ plex_auth_client_identifier }}"
          token: "{{ plex_auth_token }}"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        base_path: "{{ server_appdata_path }}"
        overwrite: true

- name: "Auth Token | Display Plex Auth Token"
  ansible.builtin.debug:
    msg: "Plex Auth Token: {{ plex_auth_token }}"
