---
- name: Permissions | Set directory ownership recursively
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/chown.yml"
  vars:
    chown_paths:
      - "{{ server_local_folder_path }}"
      - "{{ server_appdata_path }}"
      - "/home/{{ user.name }}"
