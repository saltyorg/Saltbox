---
- name: Config | Resolve hostnames
  ansible.builtin.include_tasks: "subtasks/hostnames.yml"

- name: Config | Import 'ddclient.conf'
  ansible.builtin.template:
    src: "ddclient.conf.j2"
    dest: "{{ lookup('role_var', '_paths_location', role='ddclient') }}/ddclient.conf"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0664"
    force: "{{ ('ddclient-reset' in ansible_run_tags) }}"
