---
################################
# Basics
################################

ddclient_name: ddclient

################################
# Settings
################################

# Roles whose web hostnames ddclient keeps updated in Cloudflare
# Roles that support instances include every instance in "<role>_instances",
# other roles use their single "<role>_name"
# Hostnames follow each role or instance's web subdomain and domain settings
ddclient_role_roles_default:
  - authelia
  - traefik
  - plex
  - autoscan
  - tautulli
  - overseerr
  - portainer
  - organizr
  - nzbget
  - sabnzbd
  - prowlarr
  - jackett
  - nzbhydra2
  - sonarr
  - radarr
  - lidarr
ddclient_role_roles_custom: []
ddclient_role_roles: "{{ lookup('role_var', '_roles_default', role='ddclient')
                         + lookup('role_var', '_roles_custom', role='ddclient') }}"

# Additional hostnames to keep updated, in the same Cloudflare zone as user.domain
# Example: ["files.example.com", "example.com"]
ddclient_role_hostnames_custom: []

################################
# Paths
################################

ddclient_role_paths_folder: "{{ ddclient_name }}"
ddclient_role_paths_location: "{{ server_appdata_path }}/{{ ddclient_role_paths_folder }}"
ddclient_role_paths_folders_list:
  - "{{ ddclient_role_paths_location }}"

################################
# Docker
################################

# Container
ddclient_role_docker_container: "{{ ddclient_name }}"

# Image
ddclient_role_docker_image_pull: true
ddclient_role_docker_image_repo: "lscr.io/linuxserver/ddclient"
ddclient_role_docker_image_tag: "latest"
ddclient_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='ddclient') }}:{{ lookup('role_var', '_docker_image_tag', role='ddclient') }}"

# Envs
ddclient_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"
ddclient_role_docker_envs_custom: {}
ddclient_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='ddclient')
                               | combine(lookup('role_var', '_docker_envs_custom', role='ddclient')) }}"

# Volumes
ddclient_role_docker_volumes_global: false
ddclient_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='ddclient') }}:/config"
ddclient_role_docker_volumes_custom: []
ddclient_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='ddclient')
                                  + lookup('role_var', '_docker_volumes_custom', role='ddclient') }}"

# Hostname
ddclient_role_docker_hostname: "{{ ddclient_name }}"

# Networks
ddclient_role_docker_networks_alias: "{{ ddclient_name }}"
ddclient_role_docker_networks_default: []
ddclient_role_docker_networks_custom: []
ddclient_role_docker_networks: "{{ docker_networks_common
                                   + lookup('role_var', '_docker_networks_default', role='ddclient')
                                   + lookup('role_var', '_docker_networks_custom', role='ddclient') }}"

# Restart Policy
ddclient_role_docker_restart_policy: unless-stopped
