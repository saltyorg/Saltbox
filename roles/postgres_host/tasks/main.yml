---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install postgresql-common
  ansible.builtin.apt:
    name: postgresql-common
    state: latest

- name: Run PGDG script
  ansible.builtin.command: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
  args:
    creates: /etc/apt/sources.list.d/pgdg.list

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_host_role_data_directory }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0755'

- name: Create symlink for entire PostgreSQL directory
  ansible.builtin.file:
    src: "{{ postgres_host_role_data_directory }}"
    dest: "/etc/postgresql"
    state: link
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    follow: false
    force: true

- name: Gather package facts before PostgreSQL package convergence
  ansible.builtin.package_facts:

- name: Release PostgreSQL packages from hold
  ansible.builtin.dpkg_selections:
    name: "postgresql-{{ item }}"
    selection: install
  loop: "{{ postgres_host_role_versions }}"
  when: ('postgresql-' ~ item) in ansible_facts['packages']

- name: Install PostgreSQL packages for specified versions
  ansible.builtin.apt:
    name: "postgresql-{{ item }}"
    state: latest
  loop: "{{ postgres_host_role_versions }}"

- name: Put PostgreSQL packages into hold
  ansible.builtin.dpkg_selections:
    name: "postgresql-{{ item }}"
    selection: hold
  loop: "{{ postgres_host_role_versions }}"
  when: put_postgres_host_dpkg_into_hold

- name: Create PostgreSQL run directory
  ansible.builtin.file:
    path: "/var/run/postgresql"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0755'

- name: Find all PostgreSQL services
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "list-units"
      - "--type=service"
      - "--state=loaded"
      - "--no-legend"
  register: postgres_services_query
  changed_when: false
  failed_when: false

- name: Parse PostgreSQL service names
  ansible.builtin.set_fact:
    postgres_services: "{{ postgres_services_query.stdout_lines
                           | map('split')
                           | map('first')
                           | select('search', 'postgresql')
                           | list }}"

- name: Stop and disable unspecified PostgreSQL versions
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ postgres_services }}"
  when:
    - item != "postgresql.service"
    - item not in (postgres_host_role_versions | map('regex_replace', '^(.*)$', 'postgresql@\\1-main.service') | list)
  failed_when: false

- name: Discover PostgreSQL clusters before default cleanup
  ansible.builtin.command:
    argv:
      - "pg_lsclusters"
      - "--no-header"
  register: postgres_clusters_before_cleanup
  changed_when: false

- name: Initialize package-default PostgreSQL versions
  ansible.builtin.set_fact:
    postgres_default_cluster_versions: []

- name: Parse package-default PostgreSQL versions
  ansible.builtin.set_fact:
    postgres_default_cluster_versions: "{{ postgres_default_cluster_versions + [item.split()[0]] }}"
  loop: "{{ postgres_clusters_before_cleanup.stdout_lines }}"
  when:
    - (item.split() | length >= 6)
    - item.split()[0] in postgres_host_role_versions
    - item.split()[1] == 'main'
    - item.split()[5] == '/var/lib/postgresql/' + item.split()[0] + '/main'

- name: Stop default clusters if they exist
  ansible.builtin.command: >
    pg_ctlcluster {{ item }} main stop
  loop: "{{ postgres_default_cluster_versions }}"
  failed_when: false

- name: Remove default clusters if they exist
  ansible.builtin.command: >
    pg_dropcluster {{ item }} main
  loop: "{{ postgres_default_cluster_versions }}"

- name: Check if clusters are already configured
  ansible.builtin.command:
    argv:
      - "pg_lsclusters"
      - "--no-header"
  register: clusters_configured
  become: true
  become_user: "{{ user.name }}"
  changed_when: false

- name: Initialize configured PostgreSQL versions
  ansible.builtin.set_fact:
    postgres_configured_cluster_versions: []

- name: Parse configured PostgreSQL versions
  ansible.builtin.set_fact:
    postgres_configured_cluster_versions: "{{ postgres_configured_cluster_versions + [item.split()[0]] }}"
  loop: "{{ clusters_configured.stdout_lines }}"
  when:
    - (item.split() | length >= 2)
    - (item.split()[1] == 'main')

- name: Calculate desired port assignments based on version order
  ansible.builtin.set_fact:
    postgres_port_assignments: "{{ postgres_port_assignments | default({}) | combine({item: (5432 + my_idx)}) }}"
  loop: "{{ postgres_host_role_versions }}"
  loop_control:
    index_var: my_idx

- name: Ensure PostgreSQL log directory ownership
  ansible.builtin.file:
    path: /var/log/postgresql
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true

- name: Update port in postgresql.conf for existing clusters
  ansible.builtin.lineinfile:
    path: "{{ postgres_host_role_data_directory }}/{{ item }}/main/postgresql.conf"
    regexp: "^#?port ="
    line: "port = {{ postgres_port_assignments[item] }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
  loop: "{{ postgres_host_role_versions }}"
  when:
    - postgres_port_assignments[item] is defined
    - item in postgres_configured_cluster_versions

- name: Create clusters with custom data directory and user
  ansible.builtin.command: >
    pg_createcluster {{ item }} main
    -d={{ postgres_host_role_data_directory }}/{{ item }}/data
    -u={{ user.name }}
    -g={{ user.name }}
    -p={{ postgres_port_assignments[item] }}
    -s={{ postgres_host_role_socket_directory }}
  loop: "{{ postgres_host_role_versions }}"
  become: true
  become_user: "{{ user.name }}"
  when: item not in postgres_configured_cluster_versions

- name: Override data directory in postgresql.conf for all configured versions
  ansible.builtin.lineinfile:
    path: "{{ postgres_host_role_data_directory }}/{{ item }}/main/postgresql.conf"
    regexp: "^#?data_directory ="
    line: "data_directory = '{{ postgres_host_role_data_directory }}/{{ item }}/data'"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
  loop: "{{ postgres_host_role_versions }}"

- name: Override socket directory in postgresql.conf for all configured versions
  ansible.builtin.lineinfile:
    path: "{{ postgres_host_role_data_directory }}/{{ item }}/main/postgresql.conf"
    regexp: "^#?unix_socket_directories ="
    line: "unix_socket_directories = '{{ postgres_host_role_socket_directory }}'"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
  loop: "{{ postgres_host_role_versions }}"

- name: Set listen_addresses in postgresql.conf for all configured versions
  ansible.builtin.lineinfile:
    path: "{{ postgres_host_role_data_directory }}/{{ item }}/main/postgresql.conf"
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '{{ postgres_host_role_listen_addresses }}'"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
  loop: "{{ postgres_host_role_versions }}"

- name: Create systemd override directory for PostgreSQL service
  ansible.builtin.file:
    path: "/etc/systemd/system/postgresql@.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create systemd override for PostgreSQL service
  ansible.builtin.template:
    src: postgresql-override.conf.j2
    dest: "/etc/systemd/system/postgresql@.service.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  register: postgres_systemd_override

- name: Reload systemd daemon after override changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: postgres_systemd_override.changed

- name: Stop all PostgreSQL services before port validation
  ansible.builtin.systemd:
    name: "postgresql@{{ item }}-main"
    state: stopped
  loop: "{{ postgres_host_role_versions }}"
  failed_when: false

- name: Stop generic PostgreSQL service
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
  failed_when: false

- name: Check if desired ports are available
  ansible.builtin.wait_for:
    port: "{{ postgres_port_assignments[item] }}"
    host: "127.0.0.1"
    state: stopped
    timeout: 1
  loop: "{{ postgres_host_role_versions }}"
  register: port_check_results
  failed_when: false

- name: Fail if any desired ports are not available
  ansible.builtin.fail:
    msg: "Port {{ postgres_port_assignments[item] }} for PostgreSQL version {{ item }} is not available (in use by another service)"
  loop: "{{ postgres_host_role_versions }}"
  loop_control:
    index_var: port_idx
  when: port_check_results.results[port_idx].failed

- name: Start PostgreSQL services with correct port assignments
  ansible.builtin.systemd:
    name: "postgresql@{{ item }}-main"
    state: started
    enabled: true
  loop: "{{ postgres_host_role_versions }}"

- name: Ensure generic PostgreSQL service is enabled
  ansible.builtin.systemd:
    name: postgresql
    enabled: true

- name: Setup databases and users for each PostgreSQL version
  ansible.builtin.include_tasks: setup_version.yml
  vars:
    postgres_version: "{{ postgres_item }}"
    cluster_port: "{{ postgres_port_assignments[postgres_item] }}"
  loop: "{{ postgres_host_role_versions | unique }}"
  loop_control:
    loop_var: "postgres_item"
