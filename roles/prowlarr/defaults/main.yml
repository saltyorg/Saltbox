---
################################
# Basics
################################

prowlarr_name: prowlarr

################################
# Settings
################################

prowlarr_role_external_auth: true

# Do not edit or override using the inventory
prowlarr_role_allowed_hosts_public_fqdn_default: "{{ lookup('role_var',
                                                            '_web_fqdn_override',
                                                            role='prowlarr',
                                                            default=[lookup('role_web', role='prowlarr')],
                                                            default_if_empty=true) }}"
# Do not edit or override using the inventory
prowlarr_role_allowed_hosts_public_default: "{{ prowlarr_role_allowed_hosts_public_fqdn_default
                                             if lookup('role_var', '_web_host_override', role='prowlarr', default='') | length == 0
                                             else [] }}"
# Adds public hosts accepted by Prowlarr. This is required when using a raw
# Traefik host override.
# Valid values are hostnames, IP addresses, or wildcard DNS names beginning
# with "*.". Do not include schemes, paths, or ports.
prowlarr_role_allowed_hosts_public_custom: []
# Skip docs
prowlarr_role_allowed_hosts_public: "{{ (lookup('role_var', '_allowed_hosts_public_default', role='prowlarr')
                                         + lookup('role_var', '_allowed_hosts_public_custom', role='prowlarr'))
                                        | reject('none')
                                        | map('string')
                                        | map('trim')
                                        | reject('equalto', '')
                                        | unique
                                        | list }}"
# Do not edit or override using the inventory
prowlarr_role_allowed_hosts_aliases: "{{ ([lookup('role_var', '_docker_networks_alias', role='prowlarr')]
                                          + lookup('role_var', '_docker_networks_alias_custom', role='prowlarr', default=[]))
                                         | reject('none')
                                         | map('string')
                                         | map('trim')
                                         | reject('equalto', '')
                                         | unique
                                         | list }}"
# Do not edit or override using the inventory
prowlarr_role_allowed_hosts_default: "{{ lookup('role_var', '_allowed_hosts_public', role='prowlarr')
                                         + lookup('role_var', '_allowed_hosts_aliases', role='prowlarr')
                                         + (lookup('role_var', '_allowed_hosts_aliases', role='prowlarr')
                                            | map('regex_replace', '$', '.' + docker_networks_name_common)
                                            | list) }}"
# Adds extra hosts accepted by Prowlarr, such as additional Docker or host-DNS
# aliases. This does not satisfy the public-host requirement for a raw Traefik
# host override. Valid values are hostnames, IP addresses, or wildcard DNS names
# beginning with "*.". Do not include schemes, paths, or ports.
prowlarr_role_allowed_hosts_custom: []
# Skip docs
prowlarr_role_allowed_hosts: "{{ (lookup('role_var', '_allowed_hosts_default', role='prowlarr')
                                  + lookup('role_var', '_allowed_hosts_custom', role='prowlarr'))
                                 | reject('none')
                                 | map('string')
                                 | map('trim')
                                 | reject('equalto', '')
                                 | unique
                                 | list }}"

# Do not edit or override using the inventory
prowlarr_role_trusted_networks_default: "{{ ['172.19.0.0/16']
                                            + (['fd00:dead:beef::/48'] if docker_ipv6 else []) }}"
# Adds reverse-proxy peers that Prowlarr trusts to supply forwarded headers.
# Valid values are IPv4 or IPv6 addresses and CIDRs. Do not use hostnames or
# client networks.
prowlarr_role_trusted_networks_custom: []
# Skip docs
prowlarr_role_trusted_networks: "{{ (lookup('role_var', '_trusted_networks_default', role='prowlarr')
                                     + lookup('role_var', '_trusted_networks_custom', role='prowlarr'))
                                    | reject('none')
                                    | map('string')
                                    | map('trim')
                                    | reject('equalto', '')
                                    | unique
                                    | list }}"

################################
# Paths
################################

prowlarr_role_paths_folder: "{{ prowlarr_name }}"
prowlarr_role_paths_location: "{{ server_appdata_path }}/{{ prowlarr_role_paths_folder }}"
prowlarr_role_paths_config_location: "{{ prowlarr_role_paths_location }}/config.xml"
prowlarr_role_paths_folders_list:
  - "{{ prowlarr_role_paths_location }}"

################################
# Web
################################

prowlarr_role_web_subdomain: "{{ prowlarr_name }}"
prowlarr_role_web_domain: "{{ user.domain }}"
prowlarr_role_web_port: "9696"
prowlarr_role_web_url: "{{ lookup('role_web', role='prowlarr', scheme='https') }}"

################################
# DNS
################################

prowlarr_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='prowlarr') }}"
prowlarr_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='prowlarr') }}"
prowlarr_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

prowlarr_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
prowlarr_role_traefik_middleware_default: "{{ traefik_default_middleware
                                              + (',themepark-' + prowlarr_name
                                                 if (lookup('role_var', '_themepark_enabled', role='prowlarr') and global_themepark_plugin_enabled)
                                                 else '') }}"
prowlarr_role_traefik_middleware_custom: ""
prowlarr_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
prowlarr_role_traefik_middleware_custom_api: ""
prowlarr_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
prowlarr_role_traefik_enabled: true
prowlarr_role_traefik_api_enabled: true
prowlarr_role_traefik_api_endpoint: "PathRegexp(`/[0-9]+/api`) || PathRegexp(`/[0-9]+/download`) || PathPrefix(`/api`) || PathPrefix(`/ping`)"

################################
# Theme
################################

# Options can be found at https://github.com/themepark-dev/theme.park
prowlarr_role_themepark_enabled: false
prowlarr_role_themepark_app: "prowlarr"
prowlarr_role_themepark_theme: "{{ global_themepark_theme }}"
prowlarr_role_themepark_domain: "{{ global_themepark_domain }}"
prowlarr_role_themepark_addons: []

################################
# Docker
################################

# Container
prowlarr_role_docker_container: "{{ prowlarr_name }}"

# Image
prowlarr_role_docker_image_pull: true
prowlarr_role_docker_image_tag: "release"
prowlarr_role_docker_image_repo: "ghcr.io/hotio/prowlarr"
prowlarr_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='prowlarr') }}:{{ lookup('role_var', '_docker_image_tag', role='prowlarr') }}"

# Envs
prowlarr_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  UMASK: "002"
  TZ: "{{ tz }}"
prowlarr_role_docker_envs_custom: {}
prowlarr_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='prowlarr')
                               | combine(lookup('role_var', '_docker_envs_custom', role='prowlarr')) }}"

# Volumes
prowlarr_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='prowlarr') }}:/config"
prowlarr_role_docker_volumes_custom: []
prowlarr_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='prowlarr')
                                  + lookup('role_var', '_docker_volumes_custom', role='prowlarr') }}"

# Labels
prowlarr_role_docker_labels_default: {}
prowlarr_role_docker_labels_custom: {}
prowlarr_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='prowlarr')
                                 | combine((traefik_themepark_labels
                                            if (lookup('role_var', '_themepark_enabled', role='prowlarr') and global_themepark_plugin_enabled)
                                            else {}),
                                           lookup('role_var', '_docker_labels_custom', role='prowlarr')) }}"

# Hostname
prowlarr_role_docker_hostname: "{{ prowlarr_name }}"

# Networks
prowlarr_role_docker_networks_alias: "{{ prowlarr_name }}"
prowlarr_role_docker_networks_default: []
prowlarr_role_docker_networks_custom: []
prowlarr_role_docker_networks: "{{ docker_networks_common
                                   + lookup('role_var', '_docker_networks_default', role='prowlarr')
                                   + lookup('role_var', '_docker_networks_custom', role='prowlarr') }}"

# Restart Policy
prowlarr_role_docker_restart_policy: unless-stopped
