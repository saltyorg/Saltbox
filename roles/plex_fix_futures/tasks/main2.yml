---
- name: "Load facts for a specific instance"
  saltbox_facts:
    role: "plex"
    instance: "{{ plex_name }}"
    keys:
      token: ""
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: plex_instance_token

- name: Plex API Block
  when: (plex_instance_token.facts.token | length > 0)
  block:
    - name: Get items that have a date set in the future
      ansible.builtin.uri:
        url: "{{ lookup('role_var', '_web_url', role='plex') }}/library/all?X-Plex-Token={{ plex_instance_token.facts.token }}"
        method: GET
        headers:
          Accept: application/json
        return_content: true
        status_code: 200
      register: plex_future_items_request
      no_log: true

    - name: Validate Plex metadata response
      ansible.builtin.assert:
        that:
          - plex_future_items_request.json is mapping
          - plex_future_items_request.json.MediaContainer is defined
          - plex_future_items_request.json.MediaContainer is mapping
          - plex_future_items_request.json.MediaContainer.Metadata is defined
          - plex_future_items_request.json.MediaContainer.Metadata is sequence
          - plex_future_items_request.json.MediaContainer.Metadata is not string
        fail_msg: Plex returned an invalid metadata response.
      no_log: true

    - name: Select items that have a date set in the future
      ansible.builtin.set_fact:
        plex_future_items: "{{ plex_future_items_request.json.MediaContainer.Metadata
                               | selectattr('addedAt', 'defined')
                               | selectattr('addedAt', 'gt', ansible_facts['date_time']['epoch'] | int)
                               | list }}"
      no_log: true

    - name: Add type_id to each item
      ansible.builtin.set_fact:
        plex_future_items_typed: "{{ plex_future_items_typed | default([]) + [item | combine({'type_id': plex_type_mapping[item.type]})] }}"
      loop: "{{ plex_future_items }}"

    - name: Fix future dates
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - "curl"
          - "-X"
          - "PUT"
          - "{{ lookup('role_var', '_web_url', role='plex') }}/library/sections/{{ item.librarySectionID }}/all?type={{ item.type_id }}&id={{ item.id }}&addedAt.value={{ item.updatedAt }}&X-Plex-Token={{ plex_instance_token.facts.token }}"
      loop: "{{ plex_future_items_typed }}"
      register: plex_future_items_task
      when: plex_future_items_typed is defined
      no_log: true

    - name: Status
      ansible.builtin.debug:
        msg: "All items {{ 'have been fixed' if not plex_future_items_task.skipped else 'were fine already' }}."
