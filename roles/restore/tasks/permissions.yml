---
- name: "Set '{{ server_appdata_path }}' ownership recursively"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/chown.yml"
  vars:
    chown_paths:
      - "{{ server_appdata_path }}"

- name: Set '{{ server_appdata_path }}' permissions recursively
  ansible.builtin.command:
    argv:
      - "chmod"
      - "-R"
      - "ugo+X"
      - "{{ server_appdata_path }}"
