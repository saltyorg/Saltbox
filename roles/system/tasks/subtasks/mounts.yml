---
- name: Mounts | Display system mounts
  ansible.builtin.debug:
    msg: "{{ ansible_facts['mounts'] }}"
    verbosity: 1

- name: Mounts | Tune access times
  ansible.builtin.include_tasks: "mount_tuning.yml"
  when: (system_mount_tuning_enabled | bool)

- name: "Mounts | Install 'fuse3'"
  ansible.builtin.apt:
    name: "fuse3"
    state: latest

- name: Mounts | Import 'fuse.conf'
  ansible.builtin.copy:
    src: etc/fuse.conf
    dest: /etc/fuse.conf
    mode: "0664"
    force: true
