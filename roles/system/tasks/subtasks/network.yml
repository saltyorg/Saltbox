---
- name: Network | Install common packages
  ansible.builtin.apt:
    state: latest
    name:
      - vnstat
      - ethtool

- name: Network | Network Tasks Block
  vars:
    system_network_default: >-
      {{ (ansible_facts['default_ipv4'] | default({}, true))
      if (ansible_facts['default_ipv4'] | default({}, true)).get('interface')
      else (ansible_facts['default_ipv6'] | default({}, true)) }}
  when:
    - (system_network_default.interface | default('', true) | length > 0)
    - (system_network_default.type | default('') == "ether")
  block:
    - name: Network | Check for '/etc/vnstat.conf'
      ansible.builtin.stat:
        path: "/etc/vnstat.conf"
      register: vnstat_conf

    - name: Network | Set vnstat to proper default interface
      ansible.builtin.lineinfile:
        path: "/etc/vnstat.conf"
        regexp: '^[ \t]*[;#]?[ \t]*Interface[ \t]+'
        line: 'Interface "{{ system_network_default.interface }}"'
        state: present
      when: (vnstat_conf.stat.exists)

    - name: Network | Import 'rc.local' if missing
      ansible.builtin.copy:
        src: "etc/rc.local"
        dest: "/etc/rc.local"
        owner: "root"
        group: "root"
        mode: "0755"
        force: false

    - name: Network | Get NIC Info
      ansible.builtin.command:
        argv:
          - "lspci"
      register: nic

    - name: Network | Disable TSO / GSO
      ansible.builtin.blockinfile:
        path: "/etc/rc.local"
        state: present
        create: false
        marker: "### {mark} SALTBOX MANAGED BLOCK ###"
        block: |
          ethtool -K {{ system_network_default.interface }} tso off gso off
        insertbefore: "^exit 0"
        owner: "root"
        group: "root"
        mode: "0755"
      when: (('I218' in nic.stdout) or ('I219' in nic.stdout))
