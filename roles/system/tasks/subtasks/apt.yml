---
- name: APT | Set env variables
  ansible.builtin.set_fact:
    env_vars:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical

- name: APT | Gather the package facts
  ansible.builtin.package_facts:
    manager: apt

- name: APT | Import 'saltbox.conf'
  ansible.builtin.copy:
    src: saltbox.conf
    dest: "/etc/needrestart/conf.d/saltbox.conf"
    mode: "0644"
    force: true
  when: ('needrestart' in ansible_facts['packages'])

- name: APT | Fix any potential dpkg issues
  block:
    - name: APT | Run 'dpkg --configure --pending'
      ansible.builtin.command:
        argv:
          - "dpkg"
          - "--configure"
          - "--pending"
      register: system_dpkg_configure
      retries: "{{ (apt_lock_timeout | int) // 10 }}"
      delay: 10
      until: (system_dpkg_configure.rc == 0) or ('locked by another process' not in system_dpkg_configure.stderr)

  rescue:
    - name: APT | Reinstall python3-debian
      ansible.builtin.command:
        argv:
          - "apt-get"
          - "--reinstall"
          - "install"
          - "python3-debian"
          - "-o"
          - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"

    - name: APT | Run 'dpkg --configure --pending' Again
      ansible.builtin.command:
        argv:
          - "dpkg"
          - "--configure"
          - "--pending"
      register: system_dpkg_configure
      retries: "{{ (apt_lock_timeout | int) // 10 }}"
      delay: 10
      until: (system_dpkg_configure.rc == 0) or ('locked by another process' not in system_dpkg_configure.stderr)

- name: APT | Fix any potential apt issues
  ansible.builtin.command:
    argv:
      - "apt-get"
      - "install"
      - "--fix-broken"
      - "--quiet"
      - "--yes"
      - "-o"
      - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
  environment: "{{ env_vars }}"

- name: APT | APT update
  ansible.builtin.apt:
    update_cache: true
  ignore_errors: true

- name: APT | Install required packages
  ansible.builtin.apt:
    state: latest
    name:
      - apt-utils
      - byobu
      - pciutils

# https://serverfault.com/a/839563
# https://raymii.org/s/tutorials/Silent-automatic-apt-get-upgrade.html
- name: APT | APT full-upgrade
  ansible.builtin.command:
    argv:
      - "apt-get"
      - "full-upgrade"
      - "--quiet"
      - "--yes"
      - "-o"
      - "Dpkg::Options::=--force-confdef"
      - "-o"
      - "Dpkg::Options::=--force-confold"
      - "-o"
      - "DPkg::Lock::Timeout={{ apt_lock_timeout }}"
  environment: "{{ env_vars }}"
  when: (not continuous_integration)

- name: APT | Remove useless packages from the cache
  ansible.builtin.apt:
    autoclean: true

- name: APT | Remove dependencies that are no longer required
  ansible.builtin.apt:
    autoremove: true
