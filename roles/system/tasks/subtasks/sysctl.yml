---
- name: sysctl | Tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  ignore_errors: true
  loop: "{{ sysctl_settings | dict2items }}"

- name: sysctl | Check to see if '/proc/sys/net/core/netdev_budget_usecs' exists
  ansible.builtin.stat:
    path: "/proc/sys/net/core/netdev_budget_usecs"
  register: netdev_budget_usecs

- name: sysctl | Determine CONFIG_HZ
  ansible.builtin.stat:
    path: "/boot/config-{{ ansible_facts['kernel'] }}"
  register: kernel_config
  when: netdev_budget_usecs.stat.exists

- name: sysctl | Read CONFIG_HZ
  ansible.builtin.slurp:
    src: "/boot/config-{{ ansible_facts['kernel'] }}"
  register: kernel_config_content
  when:
    - netdev_budget_usecs.stat.exists
    - kernel_config.stat.exists

- name: sysctl | Parse CONFIG_HZ
  ansible.builtin.set_fact:
    kernel_config_hz: "{{ (kernel_config_content.content
                           | b64decode
                           | regex_findall('(?m)^CONFIG_HZ=(\\d+)$')
                           | first
                           | default(''))
                       if kernel_config.stat.exists
                       else '' }}"
  when: netdev_budget_usecs.stat.exists

- name: sysctl | Tuning - 'netdev_budget_usecs'
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
  ignore_errors: true
  loop:
    # Set netdev_budget_usecs
    - { name: net.core.netdev_budget_usecs, value: "{{ sysctl_netdev_budget_usecs }}" }
  when: netdev_budget_usecs.stat.exists and (sysctl_netdev_budget_usecs != 5000 or kernel_config_hz | int == 1000)

- name: sysctl | Remove old settings
  ansible.posix.sysctl:
    name: "{{ item }}"
    state: absent
    reload: true
  ignore_errors: true
  loop: "{{ sysctl_remove_settings }}"

- name: sysctl | Reload sysctl settings.
  ansible.builtin.command:
    argv:
      - "sysctl"
      - "--system"
