---
- name: Wait for '{{ lookup('role_var', '_paths_config_location', role='plex') | basename }}' to be created
  ansible.builtin.wait_for:
    path: "{{ lookup('role_var', '_paths_config_location', role='plex') }}"
    state: present

- name: Wait for {{ plex_name | title }} DB to be created
  ansible.builtin.wait_for:
    path: "{{ lookup('role_var', '_paths_db_location', role='plex') }}"
    state: present

- name: Wait for {{ plex_name | title }} executable to be created
  ansible.builtin.command:
    argv:
      - "docker"
      - "exec"
      - "{{ lookup('role_var', '_docker_container', role='plex') }}"
      - "bash"
      - "-c"
      - "ls '/usr/lib/plexmediaserver/Plex Media Server'"
  register: pms_check
  until: pms_check.stderr.find("No such file or directory") == -1
  retries: 600
  changed_when: false
  failed_when: pms_check.rc == 1 or pms_check.rc > 2

- name: Wait until Plex instance returns expected status code
  block:
    - name: Wait for Plex startup
      ansible.builtin.uri:
        url: "http://{{ plex_extra_tasks_hostname }}:32400/web/index.html"
        method: GET
        status_code: [200]
        timeout: 5
      register: plex_status_result
      until: plex_status_result.status == 200
      retries: 12
      delay: 10

  rescue:
    - name: Fail startup timeout for a new Plex installation
      ansible.builtin.fail:
        msg: "{{ plex_name }} did not become ready during initial startup. Check its container logs before retrying."
      when: not plex_database_before_start.stat.exists

    - name: Inspect Plex container after startup timeout
      community.docker.docker_container_info:
        name: "{{ lookup('role_var', '_docker_container', role='plex') }}"
      register: plex_startup_container_info

    - name: Verify Plex has remained running since deployment
      ansible.builtin.assert:
        that:
          - plex_startup_container_info.exists
          - plex_startup_container_info.container.Id == create_docker_result.container.Id
          - plex_startup_container_info.container.State.Running
          - not plex_startup_container_info.container.State.Restarting
          - not plex_startup_container_info.container.State.Paused
          - plex_startup_container_info.container.RestartCount == 0
          - plex_startup_container_info.container.State.StartedAt == create_docker_result.container.State.StartedAt
        fail_msg: "{{ plex_name }} did not become ready and is no longer running continuously since deployment. Check its container logs before retrying."
        quiet: true

    - name: Allow additional time for Plex startup
      ansible.builtin.uri:
        url: "http://{{ plex_extra_tasks_hostname }}:32400/web/index.html"
        method: GET
        status_code: [200]
        timeout: 5
      register: plex_status_result
      until: plex_status_result.status == 200
      retries: 720
      delay: 10

- name: Ensure transcodes folder has the correct permissions
  ansible.builtin.file:
    path: "{{ lookup('role_var', '_paths_transcodes_location', role='plex') }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0775"
    recurse: true

- name: Configure Plex preferences
  vars:
    plex_extra_tasks_xml_settings:
      ManualPortMappingPort: "{{ plex_docker_port_lookup | string }}"
      PublishServerOnPlexOnlineKey: "0"
      RelayEnabled: "0"
  block:
    - name: Read managed Plex XML settings
      community.general.xml_info:
        path: "{{ lookup('role_var', '_paths_config_location', role='plex') }}"
        xpath: /Preferences
        what: content_attributes
      register: plex_extra_tasks_xml_info
      no_log: true

    - name: Detect required Plex XML changes
      ansible.builtin.set_fact:
        plex_extra_tasks_xml_changes_required: "{{ (plex_extra_tasks_xml_info.content_attributes[0].attributes
                                                    | combine(plex_extra_tasks_xml_settings))
                                                 != plex_extra_tasks_xml_info.content_attributes[0].attributes }}"

    - name: Apply required Plex XML changes
      when: plex_extra_tasks_xml_changes_required | bool
      block:
        - name: Stop Docker Container
          ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/stop_docker_container.yml"
          vars:
            var_prefix: "plex"

        - name: Update managed Plex XML settings
          community.general.xml:
            path: "{{ lookup('role_var', '_paths_config_location', role='plex') }}"
            xpath: /Preferences
            attribute: "{{ plex_xml_setting.key }}"
            value: "{{ plex_xml_setting.value | string }}"
            state: present
          become: true
          become_user: "{{ user.name }}"
          loop: "{{ plex_extra_tasks_xml_settings | dict2items }}"
          loop_control:
            loop_var: plex_xml_setting
            label: "{{ plex_xml_setting.key }}"

      always:
        - name: Start Docker Container
          ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/start_docker_container.yml"
          vars:
            var_prefix: "plex"

- name: Reset permissions of '{{ lookup('role_var', '_paths_config_location', role='plex') | basename }}'
  ansible.builtin.file:
    path: "{{ lookup('role_var', '_paths_config_location', role='plex') }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
