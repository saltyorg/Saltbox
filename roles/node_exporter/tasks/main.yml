---
- name: "Cleanup tmp folder"
  ansible.builtin.file:
    path: "/tmp/node_exporter"
    state: absent

- name: "Create tmp folder"
  ansible.builtin.file:
    path: "/tmp/node_exporter"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0775"

- name: "Get URL for latest Node Exporter release"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/github_api_request.yml"
  vars:
    github_api_url: "{{ node_exporter_latest_releases_url }}"
    github_api_result_var: node_exporter_latest_release_api

- name: "Resolve URL for latest Node Exporter release"
  ansible.builtin.set_fact:
    node_exporter_latest_download_url: "{{ ((node_exporter_latest_release_api.content | from_json).assets
                                            | selectattr('name', 'search', 'linux-amd64.tar.gz')
                                            | map(attribute='browser_download_url')
                                            | first) }}"
  changed_when: false

- name: "Download and unarchive Node Exporter from Github"
  ansible.builtin.unarchive:
    src: "{{ node_exporter_latest_download_url }}"
    dest: /tmp/node_exporter
    copy: false
    validate_certs: false
  register: x
  until: "x is not failed"
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10

- name: Create directories
  ansible.builtin.file:
    path: "{{ node_exporter_path }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0775"

- name: Find Node Exporter tmp dir
  ansible.builtin.find:
    paths: /tmp/node_exporter
    patterns: node_exporter-*.linux-amd64
    file_type: directory
    recurse: false
  register: node_exporter_tmp_dirs

- name: Validate Node Exporter tmp dir
  ansible.builtin.assert:
    that:
      - node_exporter_tmp_dirs.matched == 1

- name: "Copy binary to {{ node_exporter_path }}/node_exporter"
  ansible.builtin.copy:
    src: "{{ node_exporter_tmp_dirs.files[0].path }}/node_exporter"
    dest: "{{ node_exporter_path }}/node_exporter"
    mode: "0775"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    force: true

- name: "Import 'node_exporter.service'"
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/node_exporter.service"
    force: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"

- name: Systemd daemon-reload 'node_exporter.service'
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: stopped
    enabled: false
    daemon_reload: true

- name: Systemd start 'node_exporter.service'
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/systemd/manage_service.yml"
  vars:
    _service_name: node_exporter.service
    _service_state: started
    _service_enabled: true
    _service_reenable: true

- name: "Cleanup tmp folder"
  ansible.builtin.file:
    path: "/tmp/node_exporter"
    state: absent
