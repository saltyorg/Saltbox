---
- name: Post-Install | Wait 10 seconds before continuing
  ansible.builtin.wait_for:
    timeout: 10

- name: Post-Install | Set directory ownership
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/chown.yml"
  vars:
    chown_paths:
      - "{{ lookup('role_var', '_paths_transcodes_location', role='jellyfin') }}"
      - "{{ lookup('role_var', '_paths_location', role='jellyfin') }}"

- name: Post-Install | Settings Tasks
  ansible.builtin.include_tasks: "subtasks/settings.yml"
  when: (not jellyfin_existing_install.stat.exists)
