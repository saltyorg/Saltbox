---
- name: "Handlers | Docker | Wait before pruning images"
  ansible.builtin.wait_for:
    timeout: "{{ docker_create_image_prune_delay_timeout }}"
  listen: Prune Docker images
  when:
    - (docker_create_image_prune | bool)
    - (docker_create_image_prune_delay | bool)

- name: "Handlers | Docker | Prune images"
  community.docker.docker_prune:
    images: true
    images_filters:
      until: 24h
    timeout: 120
  listen: Prune Docker images
  when: (docker_create_image_prune | bool)
  register: prune_images_result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: (prune_images_result is succeeded)
