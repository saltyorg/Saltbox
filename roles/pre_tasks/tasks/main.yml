---
- name: APT Tasks
  ansible.builtin.include_tasks: "subtasks/apt.yml"

- name: Git Tasks
  ansible.builtin.include_tasks: "subtasks/git.yml"

- name: Variables Tasks
  ansible.builtin.include_tasks: "subtasks/variables.yml"
  when: (playbook_dir != "/srv/git/saltbox" and not continuous_integration) or (playbook_dir != "/home/runner/work/Saltbox/Saltbox" and continuous_integration)

- name: Cloudflare Zone Check
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/cloudflare/resolve_certificate_zones.yml"
  when:
    - traefik_challenge_provider == 'cloudflare'
    - cloudflare_is_enabled
    - not traefik_http
