---
- name: Clone Saltbox MOTD
  ansible.builtin.git:
    repo: https://github.com/saltyorg/motd.git
    dest: "{{ server_appdata_path }}/motd"
    clone: true
    version: HEAD
    force: true
  become: true
  become_user: "{{ user.name }}"

- name: Check if 'config.json' exists
  ansible.builtin.stat:
    path: "{{ server_appdata_path }}/motd/config.json"
  register: motd_config

- name: Import default 'config.json'
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ server_appdata_path }}/motd/config.json"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0664"
    force: false
  when: (not motd_config.stat.exists)

- name: Existing config migrations
  when: motd_config.stat.exists
  no_log: true
  block:
    - name: Read existing MOTD config
      ansible.builtin.slurp:
        src: "{{ server_appdata_path }}/motd/config.json"
      register: motd_config_content

    - name: Parse existing MOTD config
      ansible.builtin.set_fact:
        motd_config_data: "{{ motd_config_content.content | b64decode | from_json }}"

    - name: Apply banner-title migration
      ansible.builtin.set_fact:
        motd_config_banner_updated: "{{ motd_config_data
                                        | combine({'motd': (motd_config_data.get('motd')
                                                            | default({}, true)
                                                            | combine({'banner_title': 'Saltbox'}))})
                                     if 'Cloudbox' in (motd_config_data.get('motd')
                                                       | default({}, true)
                                                       | default({})).get('banner_title', '') | string
                                     else motd_config_data }}"

    - name: Read migrated disk settings
      ansible.builtin.set_fact:
        motd_config_disk_data: "{{ motd_config_banner_updated.get('disk') | default({}, true) }}"

    - name: Apply disk-path migration
      ansible.builtin.set_fact:
        motd_config_updated: "{{ motd_config_banner_updated
                                 | combine({'disk': {'path': '/'}})
                              if motd_config_disk_data.get('path') is none
                              else motd_config_banner_updated }}"

    - name: Write migrated MOTD config
      ansible.builtin.copy:
        content: "{{ motd_config_updated | to_nice_json(indent=2) }}\n"
        dest: "{{ server_appdata_path }}/motd/config.json"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
      when: motd_config_updated != motd_config_data

- name: Touch '{{ server_appdata_path }}/motd/activity.log' file
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/motd/activity.log"
    state: touch
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0664"

- name: Set 'saltbox-motd.py' as executable
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/motd/saltbox-motd.py"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: a+x

- name: Import dynamic motd files
  ansible.builtin.copy:
    src: "{{ server_appdata_path }}/motd/motd/"
    dest: /etc/update-motd.d/
    force: true
    mode: "0775"
