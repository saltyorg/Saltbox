---
################################
# Basics
################################

# Setting this to false will skip the motd management and you can manage it manually
motd_install: true
# Setting this to true will switch back to the old python motd
motd_use_python: false
motd_cli_path: "/usr/local/bin/sb"
# Run sb motd --help to view what you can customize in terms of flags
motd_cli_flags: "--all --title 'Saltbox' --font ivrit --type parchment"
# Setting this to true runs the motd scripts separately for each SSH login through pam_exec, instead of through pam_motd's shared /run/motd.dynamic file
# This stops the motd from coming up blank when another SSH connection starts at the same moment, such as MobaXterm's SFTP file browser
# Saltbox edits /etc/pam.d/sshd for this and saves a timestamped backup next to it (sshd.<number>.<date>@<time>~) every time it changes the file
# Setting this to false puts the stock pam_motd line back; if you changed /etc/pam.d/sshd yourself, you can restore one of the backups manually
motd_use_pam_exec: true

################################
# Service Definitions
################################

# Service types:
#   - multi_instance_apikey: Multiple instances with API key (sonarr, radarr, lidarr, readarr, overseerr)
#   - multi_instance_token: Multiple instances with token (plex)
#   - single_instance_apikey: Single instance with API key (sabnzbd)
#   - single_instance_userpass: Single instance with username/password (nzbget)
#   - multi_instance_userpass: Multiple instances with username/password (qbittorrent)
#   - placeholder_userpass: Statically disabled username/password placeholder (rtorrent)

motd_services:
  - name: colors
    type: colors
  - name: emby
    type: multi_instance_token
    check_field: token
    output_field: token
  - name: jellyfin
    type: multi_instance_token
    check_field: token
    output_field: token
  - name: lidarr
    type: multi_instance_apikey
    check_field: api_key
    output_field: apikey
  - name: nzbget
    type: single_instance_userpass
    check_field: username
  - name: plex
    type: multi_instance_token
    check_field: token
    output_field: token
  - name: qbittorrent
    type: multi_instance_userpass_info
    check_field: username
  - name: rtorrent
    type: placeholder_userpass
    placeholder_name: rutorrent
    placeholder_url: https://rutorrent.{{ user.domain }}/RPC2
    placeholder_user: "{{ user.name }}"
  - name: radarr
    type: multi_instance_apikey
    check_field: api_key
    output_field: apikey
  - name: sabnzbd
    type: single_instance_apikey
    check_field: api_key
    output_field: apikey
  - name: sonarr
    type: multi_instance_apikey
    check_field: api_key
    output_field: apikey
  - name: systemd
    type: systemd

motd_colors:
  text:
    label: "#FF79D0"
    value: "#12C78F"
    app_name: "#BF976F"
  status:
    warning: "#F5EF34"
    success: "#12C78F"
    error: "#EB4268"
  progress_bar:
    low: "#A8CC8C"
    high: "#DBAB79"
    critical: "#E88388"

motd_systemd:
  enabled: true
  additional_services: []
  display_names: {}
