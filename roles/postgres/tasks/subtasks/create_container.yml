---
- name: Resolve official PostgreSQL image volume
  when: (lookup('role_var', '_docker_image_repo', role='postgres') == 'postgres')
  block:
    - name: Pull selected PostgreSQL image
      community.docker.docker_image_pull:
        name: "{{ lookup('role_var', '_docker_image', role='postgres') }}"
        pull: "{{ 'always' if (lookup('role_var', '_docker_image_pull', role='postgres') | bool) else 'not_present' }}"
      register: postgres_image_pull
      retries: "{{ ansible_retry_count if (not continuous_integration) else ansible_retry_count_ci }}"
      delay: 10
      until: postgres_image_pull is succeeded

    - name: Inspect selected PostgreSQL image
      community.docker.docker_image_info:
        name: "{{ lookup('role_var', '_docker_image', role='postgres') }}"
      register: postgres_container_image_info

    - name: Validate official PostgreSQL image volume
      ansible.builtin.assert:
        that:
          - postgres_container_image_info.images | length == 1
          - >-
            '/var/lib/postgresql' in (postgres_container_image_info.images[0].Config.Volumes | default({}, true))
            or '/var/lib/postgresql/data' in (postgres_container_image_info.images[0].Config.Volumes | default({}, true))
        fail_msg: "The selected official PostgreSQL image does not declare a supported data volume."

    - name: Create official PostgreSQL container
      ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
      vars:
        postgres_image_volume_path: "{{ '/var/lib/postgresql'
                                     if '/var/lib/postgresql' in postgres_container_image_info.images[0].Config.Volumes
                                     else '/var/lib/postgresql/data' }}"
        postgres_role_docker_image_pull: false

- name: Create custom PostgreSQL container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
  when: (lookup('role_var', '_docker_image_repo', role='postgres') != 'postgres')
