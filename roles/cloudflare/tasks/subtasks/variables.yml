---
- name: Variables | Set 'saltbox_type' variable
  ansible.builtin.set_fact:
    saltbox_type: "{{ 'saltbox'
                   if ('saltbox' in ansible_run_tags)
                   else 'mediabox'
                        if ('mediabox' in ansible_run_tags)
                        else 'feederbox'
                             if ('feederbox' in ansible_run_tags)
                             else '' }}"

- name: Get FLD
  tld_parse:
    url: "{{ dns_zone | default(user.domain) }}"
  register: domain_parsed

- name: Variables | Resolve Cloudflare zone
  block:
    - name: Variables | Fetch Cloudflare Zones
      ansible.builtin.uri:
        url: 'https://api.cloudflare.com/client/v4/zones?name={{ domain_parsed.fld }}'
        method: 'GET'
        headers: "{{ cloudflare_auth_headers | combine({'Content-Type': 'application/json'}) }}"
        return_content: true
      register: cf_zones

    - name: Variables | Validate Cloudflare zone lookup
      ansible.builtin.assert:
        that:
          - cf_zones.json.success | default(false) | bool
          - cf_zones.json.result | default([]) | length > 0
        fail_msg: "Cloudflare did not return zone '{{ domain_parsed.fld }}' for the configured credentials."

    - name: Variables | Set 'cloudflare_zone' Variable
      ansible.builtin.set_fact:
        cloudflare_zone: "{{ cf_zones.json.result[0].id }}"
  rescue:
    - name: Variables | Report Cloudflare Zone permission failure
      ansible.builtin.include_tasks: "{{ resources_tasks_path }}/cloudflare/permission_failure.yml"
      vars:
        cloudflare_permission_operation: "Cloudflare zone lookup"
        cloudflare_permission_section: "DNS and Zones"
        cloudflare_permission_setting: "Zone"
        cloudflare_permission_access: "Read"
        cloudflare_permission_zone: "{{ domain_parsed.fld }}"
        cloudflare_permission_error: "{{ (ansible_failed_result.json.errors | default([]))
                                      if ansible_failed_result.json is defined
                                      else (ansible_failed_result.msg
                                            | default('Cloudflare returned no error details.')) }}"
