---
- name: Configuration Rules | Remove Previous Cloudflare Configuration Rules for Lets Encrypt
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone }}/rulesets/{{ cloudflare_ruleset_id }}/rules/{{ item }}"
    method: DELETE
    headers: "{{ cloudflare_auth_headers | combine({'Content-Type': 'application/json'}) }}"
    return_content: true
  loop: "{{ cloudflare_rule_ids }}"
  register: cf_configuration_rule_destruction

- name: Configuration Rules | Validate configuration rule removal
  ansible.builtin.assert:
    that:
      - item.json.success | default(false) | bool
    fail_msg: "Cloudflare did not remove Configuration Rule '{{ item.item }}': {{ item.json.errors | default([]) }}"
  loop: "{{ cf_configuration_rule_destruction.results }}"
  loop_control:
    label: "{{ item.item }}"
