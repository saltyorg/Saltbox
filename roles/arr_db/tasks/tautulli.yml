---
- name: "Tautulli | Check if '{{ arr_db_tautulli_database }}' exists"
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"
  register: arr_db

- name: "Tautulli | Fail if database does not exist"
  ansible.builtin.fail:
    msg: "Tautulli databases are not present for {{ tautulli_name }} instance"
  when: (not arr_db.stat.exists)

- name: "Tautulli | Stop Docker container"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/stop_docker_container.yml"
  vars:
    var_prefix: "tautulli"

- name: "Tautulli | Initialize maintenance state"
  ansible.builtin.set_fact:
    arr_db_backup_directory: {}
    arr_db_restart_container: true

- name: "Tautulli | Database tasks"
  block:
    - name: "Tautulli | Check if database passes integrity_check"
      ansible.builtin.command:
        argv:
          - "sqlite3"
          - "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"
          - "PRAGMA integrity_check(1)"
      register: arr_db_integrity_check
      failed_when: (arr_db_integrity_check.rc != 0) or (arr_db_integrity_check.stdout != 'ok')

    - name: "Tautulli | Create backup directory"
      ansible.builtin.tempfile:
        state: directory
        prefix: "{{ tautulli_name }}_backup_"
      register: arr_db_backup_directory

    - name: "Tautulli | Backup databases"
      ansible.builtin.command:
        argv:
          - "cp"
          - "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"
          - "{{ arr_db_backup_directory.path }}/"

    - name: "Tautulli | Maintain databases"
      block:
        # Keep the container stopped if restoring the completed backup fails.
        - name: "Tautulli | Require successful maintenance or recovery before restart"
          ansible.builtin.set_fact:
            arr_db_restart_container: false

        - name: "Tautulli | Vacuum '{{ arr_db_tautulli_database | basename }}' database"
          ansible.builtin.command:
            argv:
              - "sqlite3"
              - "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"
              - "VACUUM;"
          register: arr_db_vacuum
          failed_when: (arr_db_vacuum.rc != 0)
          when: arr_db_run_vacuum

        - name: "Tautulli | Reindex '{{ arr_db_tautulli_database | basename }}' database"
          ansible.builtin.command:
            argv:
              - "sqlite3"
              - "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"
              - "REINDEX;"
          register: arr_db_reindex
          failed_when: (arr_db_reindex.rc != 0)
          when: arr_db_run_reindex

        - name: "Tautulli | Allow container restart after maintenance"
          ansible.builtin.set_fact:
            arr_db_restart_container: true

      rescue:
        - name: "Tautulli | Delete wal and shm files"
          ansible.builtin.file:
            path: "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ item }}"
            state: absent
          with_items: "{{ arr_db_tautulli_temp_files }}"

        - name: "Tautulli | Restore database backup"
          ansible.builtin.command:
            argv:
              - "cp"
              - "-f"
              - "{{ arr_db_backup_directory.path }}/{{ arr_db_tautulli_database }}"
              - "{{ lookup('role_var', '_paths_location', role='tautulli') }}/{{ arr_db_tautulli_database }}"

        - name: "Tautulli | Allow container restart after recovery"
          ansible.builtin.set_fact:
            arr_db_restart_container: true

        - name: "Tautulli | Report maintenance failure"
          ansible.builtin.fail:
            msg: >-
              Database maintenance failed at '{{ ansible_failed_task.name }}':
              {{ ansible_failed_result.msg | default('unknown error') }}.
              The database backup was restored.

  always:
    - name: "Tautulli | Report failed recovery"
      ansible.builtin.debug:
        msg: >-
          Database recovery failed. The container remains stopped and the backup
          is preserved at {{ arr_db_backup_directory.path }}.
      when: (not arr_db_restart_container)

    - name: "Tautulli | Start Docker container"
      ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/start_docker_container.yml"
      vars:
        var_prefix: "tautulli"
      when: arr_db_restart_container

    - name: "Tautulli | Delete backup directory"
      ansible.builtin.file:
        path: "{{ arr_db_backup_directory.path }}"
        state: absent
      when:
        - arr_db_restart_container
        - arr_db_backup_directory.path is defined
