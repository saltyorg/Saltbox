---
- name: Check if Plex instance is defined
  ansible.builtin.set_fact:
    plex_name: "{{ plex_name | default(plex_instances[0]) }}"

- name: Settings | Import Plex Auth Token role
  ansible.builtin.include_role:
    name: plex_auth_token
  when: plex_account_is_enabled

- name: Settings | Check if SABnzbd is installed
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_config_location', role='sabnzbd') }}"
  register: stat_sabnzbd

- name: Settings | Lookup SABnzbd API Key
  ansible.builtin.set_fact:
    sabnzbd_apikey: "{{ lookup('file', lookup('role_var', '_paths_config_location', role='sabnzbd')) | regex_search('^api_key *= *.*', multiline=True) | regex_replace('.*= *(.*)$', '\\1') }}"
  when: stat_sabnzbd.stat.exists
  no_log: true

- name: Settings | Check if 'config.json' exists
  ansible.builtin.stat:
    path: "{{ cloudplow_config_path }}"
  register: cloudplow_config

- name: Settings | New 'config.json' tasks
  when: (not cloudplow_config.stat.exists)
  block:
    - name: Filter Rclone upload_from on remotes
      ansible.builtin.set_fact:
        cloudplow_upload_paths_unique: "{{ rclone.remotes
                                           | selectattr('settings.upload', 'defined')
                                           | selectattr('settings.upload', 'equalto', true)
                                           | map(attribute='settings.upload_from')
                                           | unique }}"

    - name: Settings | Fail if duplicate folders where found.
      ansible.builtin.fail:
        msg:
          - "Duplicate upload folders found. This is likely an error on your part."
          - "If not then supply your own configuration file at '{{ cloudplow_config_path }}' and rerun the previous tag."
      when: (cloudplow_remotes | length) != (cloudplow_upload_paths_unique | length)

    - name: Settings | Import 'config.json'
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ cloudplow_config_path }}"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
        force: true

- name: Settings | Existing 'config.json' tasks
  when: cloudplow_config.stat.exists
  block:
    - name: Settings | Read existing 'config.json'
      ansible.builtin.slurp:
        src: "{{ cloudplow_config_path }}"
      register: cloudplow_config_content
      no_log: true

    - name: Settings | Parse existing 'config.json'
      ansible.builtin.set_fact:
        cloudplow_config_data: "{{ cloudplow_config_content.content | b64decode | from_json }}"
      no_log: true

    - name: Settings | Build SABnzbd updates
      ansible.builtin.set_fact:
        cloudplow_sabnzbd_updates: "{{ {'url': lookup('role_var', '_web_local_url', role='sabnzbd')}
                                       | combine({'apikey': sabnzbd_apikey}
                                                 if stat_sabnzbd.stat.exists
                                                 else {}) }}"
      no_log: true

    - name: Settings | Build 'config.json' updates
      ansible.builtin.set_fact:
        cloudplow_config_updates: "{{ {'core': {'rclone_config_path': rclone_config_path},
                                       'nzbget': {'url': lookup('role_var', '_web_local_url_web_login', role='nzbget')},
                                       'sabnzbd': cloudplow_sabnzbd_updates,
                                       'plex': {'url': lookup('role_var', '_web_url', role='plex'),
                                                'token': plex_auth_token | default('')}} }}"
      no_log: true

    - name: Settings | Build updated 'config.json'
      ansible.builtin.set_fact:
        cloudplow_config_updated: "{{ cloudplow_config_data | combine(cloudplow_config_updates, recursive=true) }}"
      no_log: true

    - name: Settings | Write updated 'config.json'
      ansible.builtin.copy:
        content: "{{ cloudplow_config_updated | to_nice_json(indent=2) }}\n"
        dest: "{{ cloudplow_config_path }}"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
      no_log: true

- name: Settings | Upgrade 'config.json'
  ansible.builtin.command:
    argv:
      - "{{ cloudplow_python_path }}"
      - "{{ cloudplow_script_path }}"
      - "update_config"
  become: true
  become_user: "{{ user.name }}"
  ignore_errors: true
