---
################################
# Basics
################################

radarr_instances: ["radarr"]

################################
# Settings
################################

radarr_role_external_auth: true

# Do not edit or override using the inventory
radarr_role_allowed_hosts_public_fqdn_default: "{{ lookup('role_var',
                                                          '_web_fqdn_override',
                                                          role='radarr',
                                                          default=[lookup('role_web', role='radarr')],
                                                          default_if_empty=true) }}"
# Do not edit or override using the inventory
radarr_role_allowed_hosts_public_default: "{{ radarr_role_allowed_hosts_public_fqdn_default
                                           if lookup('role_var', '_web_host_override', role='radarr', default='') | length == 0
                                           else [] }}"
# Adds public hosts accepted by Radarr. This is required when using a raw
# Traefik host override.
# Valid values are hostnames, IP addresses, or wildcard DNS names beginning
# with "*.". Do not include schemes, paths, or ports.
radarr_role_allowed_hosts_public_custom: []
# Skip docs
radarr_role_allowed_hosts_public: "{{ (lookup('role_var', '_allowed_hosts_public_default', role='radarr')
                                       + lookup('role_var', '_allowed_hosts_public_custom', role='radarr'))
                                      | reject('none')
                                      | map('string')
                                      | map('trim')
                                      | reject('equalto', '')
                                      | unique
                                      | list }}"
# Do not edit or override using the inventory
radarr_role_allowed_hosts_aliases: "{{ ([lookup('role_var', '_docker_networks_alias', role='radarr')]
                                        + lookup('role_var', '_docker_networks_alias_custom', role='radarr', default=[]))
                                       | reject('none')
                                       | map('string')
                                       | map('trim')
                                       | reject('equalto', '')
                                       | unique
                                       | list }}"
# Do not edit or override using the inventory
radarr_role_allowed_hosts_default: "{{ lookup('role_var', '_allowed_hosts_public', role='radarr')
                                       + lookup('role_var', '_allowed_hosts_aliases', role='radarr')
                                       + (lookup('role_var', '_allowed_hosts_aliases', role='radarr')
                                          | map('regex_replace', '$', '.' + docker_networks_name_common)
                                          | list) }}"
# Adds extra hosts accepted by Radarr, such as additional Docker or host-DNS
# aliases. This does not satisfy the public-host requirement for a raw Traefik
# host override. Valid values are hostnames, IP addresses, or wildcard DNS names
# beginning with "*.". Do not include schemes, paths, or ports.
radarr_role_allowed_hosts_custom: []
# Skip docs
radarr_role_allowed_hosts: "{{ (lookup('role_var', '_allowed_hosts_default', role='radarr')
                                + lookup('role_var', '_allowed_hosts_custom', role='radarr'))
                               | reject('none')
                               | map('string')
                               | map('trim')
                               | reject('equalto', '')
                               | unique
                               | list }}"

# Do not edit or override using the inventory
radarr_role_trusted_networks_default: "{{ ['172.19.0.0/16']
                                          + (['fd00:dead:beef::/48'] if docker_ipv6 else []) }}"
# Adds reverse-proxy peers that Radarr trusts to supply forwarded headers.
# Valid values are IPv4 or IPv6 addresses and CIDRs. Do not use hostnames or
# client networks.
radarr_role_trusted_networks_custom: []
# Skip docs
radarr_role_trusted_networks: "{{ (lookup('role_var', '_trusted_networks_default', role='radarr')
                                   + lookup('role_var', '_trusted_networks_custom', role='radarr'))
                                  | reject('none')
                                  | map('string')
                                  | map('trim')
                                  | reject('equalto', '')
                                  | unique
                                  | list }}"

################################
# Paths
################################

radarr_role_paths_folder: "{{ radarr_name }}"
radarr_role_paths_location: "{{ server_appdata_path }}/{{ radarr_role_paths_folder }}"
radarr_role_paths_folders_list:
  - "{{ radarr_role_paths_location }}"
radarr_role_paths_config_location: "{{ radarr_role_paths_location }}/config.xml"

################################
# Web
################################

radarr_role_web_subdomain: "{{ radarr_name }}"
radarr_role_web_domain: "{{ user.domain }}"
radarr_role_web_port: "7878"
radarr_role_web_url: "{{ lookup('role_web', role='radarr', scheme='https') }}"

################################
# DNS
################################

radarr_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='radarr') }}"
radarr_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='radarr') }}"
radarr_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

radarr_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
radarr_role_traefik_middleware_default: "{{ traefik_default_middleware
                                            + (',themepark-' + radarr_name
                                               if (lookup('role_var', '_themepark_enabled', role='radarr') and global_themepark_plugin_enabled)
                                               else '') }}"
radarr_role_traefik_middleware_custom: ""
radarr_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
radarr_role_traefik_middleware_custom_api: ""
radarr_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
radarr_role_traefik_enabled: true
radarr_role_traefik_api_enabled: true
radarr_role_traefik_api_endpoint: "PathPrefix(`/api`) || PathPrefix(`/feed`) || PathPrefix(`/ping`)"

################################
# Theme
################################

# Options can be found at https://github.com/themepark-dev/theme.park
radarr_role_themepark_enabled: false
radarr_role_themepark_app: "radarr"
radarr_role_themepark_theme: "{{ global_themepark_theme }}"
radarr_role_themepark_domain: "{{ global_themepark_domain }}"
radarr_role_themepark_addons: []

################################
# Docker
################################

# Container
radarr_role_docker_container: "{{ radarr_name }}"

# Image
radarr_role_docker_image_pull: true
radarr_role_docker_image_repo: "ghcr.io/hotio/radarr"
radarr_role_docker_image_tag: "release"
radarr_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='radarr') }}:{{ lookup('role_var', '_docker_image_tag', role='radarr') }}"

# Envs
radarr_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  UMASK: "002"
  TZ: "{{ tz }}"
radarr_role_docker_envs_custom: {}
radarr_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='radarr')
                             | combine(lookup('role_var', '_docker_envs_custom', role='radarr')) }}"

# Volumes
radarr_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='radarr') }}:/config"
  - "{{ server_appdata_path }}/scripts:/scripts"
radarr_role_docker_volumes_legacy:
  - "/mnt/unionfs/Media/Movies:/movies"
radarr_role_docker_volumes_custom: []
radarr_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='radarr')
                                + lookup('role_var', '_docker_volumes_custom', role='radarr')
                                + (lookup('role_var', '_docker_volumes_legacy', role='radarr')
                                   if docker_legacy_volume
                                   else []) }}"

# Labels
radarr_role_docker_labels_default: {}
radarr_role_docker_labels_custom: {}
radarr_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='radarr')
                               | combine((traefik_themepark_labels
                                          if (lookup('role_var', '_themepark_enabled', role='radarr') and global_themepark_plugin_enabled)
                                          else {}),
                                         lookup('role_var', '_docker_labels_custom', role='radarr')) }}"

# Hostname
radarr_role_docker_hostname: "{{ radarr_name }}"

# Networks
radarr_role_docker_networks_alias: "{{ radarr_name }}"
radarr_role_docker_networks_default: []
radarr_role_docker_networks_custom: []
radarr_role_docker_networks: "{{ docker_networks_common
                                 + lookup('role_var', '_docker_networks_default', role='radarr')
                                 + lookup('role_var', '_docker_networks_custom', role='radarr') }}"

# Restart Policy
radarr_role_docker_restart_policy: unless-stopped
