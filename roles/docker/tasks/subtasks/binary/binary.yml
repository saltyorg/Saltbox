---
- name: Binary | Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Binary | Install Docker binaries
  ansible.builtin.include_tasks: "binary2.yml"
  loop:
    - 'containerd_io'
    - 'docker_ce'
    - 'docker_ce_cli'
    - 'compose_cli'
    - 'docker_rootless'

- name: Binary | Install apparmor
  ansible.builtin.apt:
    name:
      - apparmor
