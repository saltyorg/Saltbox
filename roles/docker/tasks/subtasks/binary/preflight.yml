---
- name: Binary Preflight | Validate docker_version format
  ansible.builtin.assert:
    that:
      - docker_version is defined
      - docker_version is string
      - docker_version | length > 0
      - docker_version is match('^[0-9]+$') or docker_version is match('^[0-9]+\.[0-9]+$') or docker_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: |
      Invalid docker_version format: '{{ docker_version }}'
      Supported formats:
        - Major version: "28" (installs latest 28.x.x)
        - Major.minor version: "28.5" (installs latest 28.5.x)
        - Exact version: "28.5.2" (installs exactly 28.5.2)
    success_msg: "docker_version '{{ docker_version }}' format is valid"

- name: Binary Preflight | Identify apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d/
    recurse: false
    patterns:
      - "*.list"
  register: apt_source_files

- name: Binary Preflight | Check if file contains 'download.docker.com'
  ansible.builtin.slurp:
    path: "{{ item.path }}"
  register: file_contents
  loop: "{{ apt_source_files.files }}"

- name: Binary Preflight | Remove apt source files containing 'download.docker.com'
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ file_contents.results }}"
  when: ('download.docker.com' in item.content | b64decode)

- name: Binary Preflight | Ensure '/etc/apt/keyrings' exists
  ansible.builtin.file:
    path: "/etc/apt/keyrings"
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Binary Preflight | Add official gpg signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: result is succeeded

- name: Binary Preflight | Add official repository
  ansible.builtin.deb822_repository:
    name: "{{ docker_apt_repo_filename }}"
    types:
      - deb
    uris: "{{ docker_apt_repo_uris }}"
    suites: "{{ docker_apt_repo_suites }}"
    components: "{{ docker_apt_repo_components }}"
    architectures: "{{ docker_apt_repo_architectures }}"
    signed_by: "{{ docker_apt_repo_signed_by }}"
    state: present

- name: Binary Preflight | Update APT package index
  ansible.builtin.apt:
    update_cache: true
  register: result
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10
  until: result is succeeded

- name: Binary Preflight | Resolve Docker version
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/subtasks/binary/version_resolver.yml"
