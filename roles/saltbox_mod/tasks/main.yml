---
- name: Resources | Tasks | Docker | Set Docker Devices Variable | Check if '/dev/dri' exists
  ansible.builtin.stat:
    path: "{{ server_appdata_path }}/saltbox_mod"
  register: saltbox_mod_stat

- name: Create saltbox_mod directory
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/saltbox_mod"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0775"
    recurse: true

- name: Clone saltbox_mod repo
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/clone_git_repo.yml"
  vars:
    git_repo_url: "{{ saltbox_mod_repo }}"
    git_repo_dest: "{{ server_appdata_path }}/saltbox_mod"
    git_repo_version: "{{ saltbox_mod_branch }}"
    git_repo_force: true
    git_repo_become: true
    git_repo_become_user: "{{ user.name }}"
  when: (not saltbox_mod_stat.stat.exists) or saltbox_mod_force_overwrite
