# Title:         Saltbox: HTTP Anidb Metadata Agent (HAMA) &            #
#                           Absolute Series Scanner (ASS)               #
# Author(s):     maximuskowalski, salty                                 #
# URL:           https://github.com/saltyorg/Saltbox                    #
