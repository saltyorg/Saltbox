#########################################################################
---
- name: "Stop {{ plex_name }} container"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/stop_docker_container.yml"
  vars:
    var_prefix: plex
  when: (plex_name in docker_running_containers)

- name: "Create ASS and HAMA directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0775"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
  with_items:
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Scanners"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Scanners/Series"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/AniDB"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/Plex"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/OMDB"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TMDB"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/blank"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/_cache/fanart/original"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/episodes"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/fanart/original"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/fanart/vignette"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/graphical"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/posters"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/seasons"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/seasonswide"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/TVDB/text"
    - "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-in Support/Data/com.plexapp.agents.hama/DataItems/FanartTV"

- name: "Get latest Absolute Series Scanner.py"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ZeroQI/Absolute-Series-Scanner/master/Scanners/Series/Absolute%20Series%20Scanner.py
    dest: "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Scanners/Series/Absolute Series Scanner.py"
    mode: "0775"
  register: x
  until: "x is not failed"
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10

- name: "Set ASS directory permissions"
  ansible.builtin.file:
    path: "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Scanners"
    state: directory
    mode: "0775"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true

- name: "Clone Hama Bundle"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/clone_git_repo.yml"
  vars:
    git_repo_url: https://github.com/ZeroQI/Hama.bundle.git
    git_repo_dest: "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-ins/Hama.bundle"
    git_repo_version: HEAD
    git_repo_force: true
    git_repo_become: true
    git_repo_become_user: "{{ user.name }}"

- name: "Set HAMA directory permissions"
  ansible.builtin.file:
    path: "{{ lookup('role_var', '_paths_location', role='plex') }}/Library/Application Support/Plex Media Server/Plug-ins/Hama.bundle"
    state: directory
    mode: "0775"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true

- name: "Start {{ plex_name }} container"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/start_docker_container.yml"
  vars:
    var_prefix: plex
  when: (plex_name in docker_running_containers)
