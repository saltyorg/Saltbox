---
- name: Gather list of running Docker containers
  community.docker.docker_host_info:
    containers: true
  register: docker_running_containers_info
  ignore_errors: true

- name: Set running Docker container names
  ansible.builtin.set_fact:
    docker_running_containers: "{{ docker_running_containers_info.containers
                                   | default([])
                                   | map(attribute='Names')
                                   | map('first')
                                   | map('regex_replace', '^/', '')
                                   | list }}"

- name: Loop tasks
  ansible.builtin.include_tasks: "subtasks/loop.yml"
  loop: "{{ plex_instances }}"
  loop_control:
    loop_var: plex_instance
  vars:
    plex_name: "{{ plex_instance }}"
