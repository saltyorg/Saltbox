---
- name: Repository | Print Git Hash
  ansible.builtin.debug:
    msg: "Commit: {{ sanity_check_repo['commit'] | default('unknown', true) }}"

- name: Repository | Saltbox Status
  ansible.builtin.debug:
    msg: "{{ sanity_check_repo_status_messages[sanity_check_repo['status']]
             | default(sanity_check_repo_status_messages['unknown']) }}"
