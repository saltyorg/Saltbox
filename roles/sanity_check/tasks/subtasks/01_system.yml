---
- name: System | Ensure Ansible is running on a supported Ubuntu LTS release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ['22.04', '24.04', '26.04']
    fail_msg: "Saltbox supports Ubuntu Server 22.04, 24.04, and 26.04 LTS."
    success_msg: "System is running {{ ansible_facts['lsb']['description'] }}."

- name: System | Virtualization Check
  ansible.builtin.command: "systemd-detect-virt"
  register: systemd_detect_virt
  failed_when: false

- name: System | Print Virtualization Status
  ansible.builtin.debug:
    msg: "System Virtualization Status: {{ systemd_detect_virt.stdout | default('ERROR') }}"
