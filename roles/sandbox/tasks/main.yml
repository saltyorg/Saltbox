---
- name: Create Sandbox directory
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/sandbox"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true

- name: Check if git repository exists
  ansible.builtin.stat:
    path: "{{ server_appdata_path }}/sandbox/.git"
  register: git_repo_check

- name: Clone Sandbox repo 'HEAD'
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/clone_git_repo.yml"
  vars:
    git_repo_url: https://github.com/saltyorg/sandbox.git
    git_repo_dest: "{{ server_appdata_path }}/sandbox"
    git_repo_version: HEAD
    git_repo_force: true
    git_repo_become: true
    git_repo_become_user: "{{ user.name }}"
    git_repo_result_var: sandbox_clone_status
    git_repo_fail_on_error: false
  when: not git_repo_check.stat.exists

- name: Clone Sandbox repo 'master'
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/clone_git_repo.yml"
  vars:
    git_repo_url: https://github.com/saltyorg/sandbox.git
    git_repo_dest: "{{ server_appdata_path }}/sandbox"
    git_repo_version: master
    git_repo_force: true
    git_repo_become: true
    git_repo_become_user: "{{ user.name }}"
  when:
    - not git_repo_check.stat.exists
    - sandbox_clone_status is failed

- name: Activate Git Hooks
  ansible.builtin.command:
    argv:
      - "bash"
      - "{{ server_appdata_path }}/sandbox/bin/git/init-hooks"
  args:
    chdir: "{{ server_appdata_path }}/sandbox"
