---
- name: "ZeroSSL | Display ZeroSSL status"
  ansible.builtin.debug:
    msg: "ZeroSSL setting is {{ 'enabled' if zerossl_is_enabled else 'disabled' }}."

- name: "ZeroSSL | Load facts for a specific instance"
  saltbox_facts:
    role: "zerossl"
    instance: "zerossl"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: zerossl_saltbox_facts
  no_log: true

- name: "ZeroSSL | Set ZeroSSL variables"
  ansible.builtin.set_fact:
    traefik_zerossl_kid: "{{ zerossl_saltbox_facts.facts.kid | default('', true) }}"
    traefik_zerossl_hmacencoded: "{{ zerossl_saltbox_facts.facts.hmacencoded | default('', true) }}"
  when: (zerossl_saltbox_facts is not skipped)
  no_log: true

- name: "ZeroSSL | New Credentials Block"
  when:
    - (zerossl_saltbox_facts is not skipped)
    - ((zerossl_saltbox_facts.facts.kid | default('', true) | length == 0)
       or (zerossl_saltbox_facts.facts.hmacencoded | default('', true) | length == 0))
  block:
    - name: "ZeroSSL | Get new credentials"
      ansible.builtin.uri:
        url: https://api.zerossl.com/acme/eab-credentials-email
        method: POST
        body:
          email: "{{ user.email }}"
        body_format: form-urlencoded
        return_content: true
      register: zerossl
      ignore_errors: true

    - name: "ZeroSSL | Set ZeroSSL variables"
      ansible.builtin.set_fact:
        traefik_zerossl_kid: "{{ zerossl.json.eab_kid }}"
        traefik_zerossl_hmacencoded: "{{ zerossl.json.eab_hmac_key }}"
      when:
        - (zerossl.status == 200)
        - zerossl.json.success

    - name: "ZeroSSL | Fail when unable to get new credentials"
      ansible.builtin.fail:
        msg: Failed to retrieve ZeroSSL credentials.
      when:
        - ((zerossl.status != 200) or (not zerossl.json.success))
        - zerossl_is_enabled

    - name: "ZeroSSL | Print failure when unable to get new credentials"
      ansible.builtin.debug:
        msg: Failed to retrieve ZeroSSL credentials.
      when:
        - ((zerossl.status != 200) or (not zerossl.json.success))
        - (not zerossl_is_enabled)

    - name: "ZeroSSL | Save facts for a specific instance"
      saltbox_facts:
        role: "zerossl"
        instance: "zerossl"
        keys:
          kid: "{{ traefik_zerossl_kid }}"
          hmacencoded: "{{ traefik_zerossl_hmacencoded }}"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        base_path: "{{ server_appdata_path }}"
        overwrite: true
      when:
        - (zerossl.status == 200)
        - zerossl.json.success
      no_log: true
