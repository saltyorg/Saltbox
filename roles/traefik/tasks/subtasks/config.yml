---
- name: "Import 'dynamic.yml'"
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ lookup('role_var', '_paths_location', role='traefik') }}/dynamic.yml"
    force: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0664"

- name: Remove 'themepark.yml'
  ansible.builtin.file:
    path: "{{ lookup('role_var', '_paths_location', role='traefik') }}/themepark.yml"
    state: absent

- name: Create auth file
  community.general.htpasswd:
    path: "{{ server_appdata_path }}/traefik/auth"
    name: "{{ user.name }}"
    password: "{{ user.pass }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0664"
  no_log: true

- name: Initialize 'custom_entrypoints' variable
  ansible.builtin.set_fact:
    custom_entrypoints: []
    custom_entrypoints_ports: []

- name: Check if entrypoints container ports we already use
  ansible.builtin.fail:
    msg: "You cannot use custom entrypoint with ports 80/443"
  when: ((item.value.port | string) in ['80', '443'])
  with_dict: "{{ traefik_entrypoint_custom }}"

- name: Set 'custom_entrypoints' variable
  ansible.builtin.set_fact:
    custom_entrypoints: "{{ custom_entrypoints
                            + (traefik_entrypoint_tls_template if item.value.tls else traefik_entrypoint_template)
                            + (traefik_entrypoint_http3_template if (item.value.tls and traefik_http3) else [])
                            + traefik_entrypoint_http_settings_template }}"
  loop: "{{ traefik_entrypoint_custom | dict2items }}"
  when: (traefik_entrypoint_custom | length > 0)

- name: Set 'custom_entrypoints_ports' variable
  ansible.builtin.set_fact:
    custom_entrypoints_ports: "{{ custom_entrypoints_ports + (lookup('vars', 'traefik_entrypoint_ports_' + item.value.type + '_template')) }}"
  loop: "{{ traefik_entrypoint_custom | dict2items }}"
  when: (traefik_entrypoint_custom | length > 0)

- name: Set 'traefik_role_docker_ports_default' variable
  ansible.builtin.set_fact:
    traefik_role_docker_ports_default: "{{ (traefik_role_docker_ports_default + custom_entrypoints_ports) | unique }}"
  when: (traefik_entrypoint_custom | length > 0)

- name: Get Tailscale addresses
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/tailscale/get_addresses.yml"
  vars:
    tailscale_ipv4_required: true
    tailscale_ipv6_required: "{{ dns_ipv6_enabled }}"
  when: (traefik_tailscale_enabled | bool)
