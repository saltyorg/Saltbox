---
- name: Persist encryption key
  saltbox_facts:
    role: arcane
    instance: "{{ arcane_name }}"
    keys:
      encryption_key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: arcane_saltbox_facts
  no_log: true

- name: Validate encryption key
  ansible.builtin.fail:
    msg: "Set arcane_role_encryption_key to a 64-character hexadecimal key in the inventory."
  when: (not (lookup('role_var', '_encryption_key', role='arcane') is match('^[a-fA-F0-9]{64}$')))

- name: Validate projects directory
  ansible.builtin.fail:
    msg: "Set arcane_role_paths_projects_location to an absolute path in the inventory."
  when: (not (lookup('role_var', '_paths_projects_location', role='arcane') is match('^/')))

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Import Postgres role
  ansible.builtin.include_role:
    name: postgres
  vars:
    postgres_instances: ["{{ lookup('role_var', '_postgres_name', role='arcane') }}"]
    postgres_role_docker_image_tag: "{{ lookup('role_var', '_postgres_docker_image_tag', role='arcane') }}"
    postgres_role_docker_image_repo: "{{ lookup('role_var', '_postgres_docker_image_repo', role='arcane') }}"
    postgres_role_paths_folder: "{{ lookup('role_var', '_paths_folder', role='arcane') }}/postgres"
    postgres_role_paths_location: "{{ lookup('role_var', '_paths_location', role='arcane') }}/postgres"
    postgres_role_docker_env_db: "{{ lookup('role_var', '_postgres_docker_env_db', role='arcane') }}"
    postgres_role_docker_env_user_include: "{{ lookup('role_var', '_postgres_user', role='arcane') }}"
    postgres_role_docker_env_password_include: "{{ lookup('role_var', '_postgres_password', role='arcane') }}"
    postgres_role_docker_healthcheck: "{{ lookup('role_var', '_postgres_docker_healthcheck', role='arcane') }}"
  when:
    - (lookup('role_var', '_postgres_enabled', role='arcane') | bool)
    - (lookup('role_var', '_postgres_deploy', role='arcane') | bool)

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"

- name: Configure initial administrator
  ansible.builtin.include_tasks: "subtasks/setup.yml"
